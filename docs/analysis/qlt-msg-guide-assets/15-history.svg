<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" role="img" aria-labelledby="title desc"><title id="title">메세지 변경이력 기록</title><desc id="desc">세 탭 모두 저장 앞에 이력기록이 붙어 품질Message 의 변경 전후를 컬럼 단위로 남긴다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="840" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="30" fill="#17324d" font-weight="700">화면에서 고친 메세지는 이력에 남습니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">세 탭 모두 저장 앞에 이력기록 액티비티가 붙어 있고, 추적 대상 컬럼이 품질Message 입니다</text>
<rect x="60" y="130" width="200" height="48" rx="24" fill="#007f86"/><text x="160" y="160" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">저장 버튼</text>
<path d="M260 154H340" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="340" y="118" width="330" height="72" rx="12" fill="#eef7f8" stroke="#007f86"/>
<text x="358" y="164" font-size="22" fill="#17324d" font-weight="700">이력기록 액티비티</text>
<path d="M670 154H750" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="750" y="118" width="315" height="72" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="768" y="164" font-size="22" fill="#17324d" font-weight="700">메세지 저장 SQL</text>
<path d="M505 190V240" fill="none" stroke="#516579" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowg)"/>
<rect x="200" y="240" width="700" height="110" rx="12" fill="#e4f4ef" stroke="#b7c8d5"/>
<text x="220" y="278" font-size="23" fill="#17324d" font-weight="700">TB_C10_QLT_DSN_CHG_HST 에 컬럼 단위로 한 행</text>
<text x="220" y="312" font-size="19" fill="#516579" font-weight="400">대상 표 · 키 · 컬럼명(QLT_MSG_NM) · 이전값 · 새값 · 화면 이름</text>
<rect x="35" y="380" width="1030" height="50" fill="#e3eef2"/><text x="45" y="410" font-size="19" fill="#17324d" font-weight="700">탭</text><text x="275" y="410" font-size="19" fill="#17324d" font-weight="700">이력의 대상 표</text><text x="565" y="410" font-size="19" fill="#17324d" font-weight="700">이력이 쓰는 키</text><text x="895" y="410" font-size="19" fill="#17324d" font-weight="700">추적 컬럼</text><rect x="35" y="430" width="1030" height="56" fill="#eef7f8" stroke="#b7c8d5"/><text x="45" y="465" font-size="19" fill="#17324d" font-weight="400">용융도금 TAB05</text><text x="275" y="465" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_MSG</text><text x="565" y="465" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행 + 제조구분</text><text x="895" y="465" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM</text><rect x="35" y="486" width="1030" height="56" fill="#f2f5f8" stroke="#b7c8d5"/><text x="45" y="521" font-size="19" fill="#17324d" font-weight="400">전기도금 TAB06</text><text x="275" y="521" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_MSG</text><text x="565" y="521" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행 (구분은 1 고정)</text><text x="895" y="521" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM</text><rect x="35" y="542" width="1030" height="56" fill="#e4f4ef" stroke="#b7c8d5"/><text x="45" y="577" font-size="19" fill="#17324d" font-weight="400">후공정 TAB09</text><text x="275" y="577" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_MSG1</text><text x="565" y="577" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행</text><text x="895" y="577" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM</text>
<rect x="35" y="620" width="505" height="190" rx="12" fill="#e4f4ef" stroke="#b7c8d5"/><text x="51" y="652" font-size="22" fill="#17324d" font-weight="700">남는 것</text><text x="51" y="682" font-size="18" fill="#17324d" font-weight="400">누가 언제 고쳤는지</text><text x="51" y="708" font-size="18" fill="#17324d" font-weight="400">어느 화면·어느 탭에서 고쳤는지</text><text x="51" y="734" font-size="18" fill="#17324d" font-weight="400">바꾸기 전 문구와 바꾼 뒤 문구</text><text x="51" y="760" font-size="18" fill="#17324d" font-weight="400">값이 실제로 달라진 컬럼만 한 행씩</text>
<rect x="560" y="620" width="505" height="190" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="576" y="652" font-size="22" fill="#17324d" font-weight="700">남지 않는 것</text><text x="576" y="682" font-size="18" fill="#17324d" font-weight="400">자동설계가 처음 만들어 넣은 값</text><text x="576" y="708" font-size="18" fill="#17324d" font-weight="400">자동설계가 지운 사실</text><text x="576" y="734" font-size="18" fill="#17324d" font-weight="400">반복주문 복사로 들어온 값</text><text x="576" y="760" font-size="18" fill="#17324d" font-weight="400">→ 이력이 없다고 “고친 적 없다”가 아닙니다</text></g></svg>
