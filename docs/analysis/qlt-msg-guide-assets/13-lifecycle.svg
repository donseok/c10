<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1090" viewBox="0 0 1100 1090" role="img" aria-labelledby="title desc"><title id="title">메세지 행의 수명주기</title><desc id="desc">자동설계는 상태가 J 인 주문의 메세지를 모두 지운 뒤 설계Key 단계에서 다시 만든다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="1090" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="30" fill="#17324d" font-weight="700">메세지 행의 수명 — 지우고 다시 만듭니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">자동설계는 고쳐 쓰지 않습니다. 통째로 지운 뒤 처음부터 다시 넣습니다</text>
<rect x="35" y="120" width="1030" height="88" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="55" y="158" font-size="22" fill="#17324d" font-weight="700">① JOB 시작</text>
<text x="55" y="190" font-size="18" fill="#516579" font-weight="400">설계 대상 주문을 잡습니다</text>
<path d="M550 208V226" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="226" width="1030" height="88" rx="12" fill="#eef7f8" stroke="#b7c8d5"/>
<text x="55" y="264" font-size="22" fill="#17324d" font-weight="700">② 상태를 J 로 바꾸고 커밋</text>
<text x="55" y="296" font-size="18" fill="#516579" font-weight="400">여기까지가 한 덩어리</text>
<path d="M550 314V332" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="332" width="1030" height="88" rx="12" fill="#fdecea" stroke="#b7c8d5"/>
<text x="55" y="370" font-size="22" fill="#17324d" font-weight="700">③ 설계 결과를 표별로 삭제</text>
<text x="55" y="402" font-size="18" fill="#516579" font-weight="400">성분·재질·인수도·제조사양·원자재·BOM·통과공정 다음이 메세지입니다</text>
<path d="M550 420V438" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="438" width="1030" height="88" rx="12" fill="#fdecea" stroke="#b7c8d5"/>
<text x="55" y="476" font-size="22" fill="#17324d" font-weight="700">④ 메세지 삭제 · 정전메세지 삭제</text>
<text x="55" y="508" font-size="18" fill="#516579" font-weight="400">상태가 J 인 주문의 행을 모두 지웁니다</text>
<path d="M550 526V544" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="544" width="1030" height="88" rx="12" fill="#e4f4ef" stroke="#b7c8d5"/>
<text x="55" y="582" font-size="22" fill="#17324d" font-weight="700">⑤ 설계Key 단계에서 다시 생성</text>
<text x="55" y="614" font-size="18" fill="#516579" font-weight="400">기준을 맞히고 메세지 행을 새로 넣습니다</text>
<path d="M550 632V650" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="650" width="1030" height="88" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="55" y="688" font-size="22" fill="#17324d" font-weight="700">⑥ 나머지 설계 단계 진행</text>
<text x="55" y="720" font-size="18" fill="#516579" font-weight="400">규격·고객·보증·원자재·제조사양·폭 …</text>
<path d="M550 738V756" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="756" width="1030" height="88" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="55" y="794" font-size="22" fill="#17324d" font-weight="700">⑦ 다음 주문으로 되돌아감</text>
<text x="55" y="826" font-size="18" fill="#516579" font-weight="400">대상이 남아 있으면 ② 로</text>
<rect x="35" y="880" width="505" height="180" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="51" y="912" font-size="22" fill="#17324d" font-weight="700">③④ 와 ⑤ 사이가 위험 구간입니다</text><text x="51" y="942" font-size="18" fill="#17324d" font-weight="400">지우는 것과 다시 넣는 것이 서로 다른 커밋 단위에</text><text x="51" y="968" font-size="18" fill="#17324d" font-weight="400">들어 있습니다. 중간에 설계가 실패하면 메세지가</text><text x="51" y="994" font-size="18" fill="#17324d" font-weight="400">지워진 채로 남을 수 있습니다.</text><text x="51" y="1020" font-size="18" fill="#17324d" font-weight="400">재설계 직후 메세지가 비어 있다면 이 구간을 의심하세요.</text>
<rect x="560" y="880" width="505" height="180" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="576" y="912" font-size="22" fill="#17324d" font-weight="700">삭제 조건은 상태값 하나뿐입니다</text><text x="576" y="942" font-size="18" fill="#17324d" font-weight="400">주문번호를 지정하지 않고, 설계공통 표의 상태가</text><text x="576" y="968" font-size="18" fill="#17324d" font-weight="400">J 인 주문 전체를 지웁니다.</text><text x="576" y="994" font-size="18" fill="#17324d" font-weight="400">그래서 특정 주문만 골라 메세지를 되살리는 경로는</text><text x="576" y="1020" font-size="18" fill="#17324d" font-weight="400">자동설계 안에 없습니다.</text></g></svg>
