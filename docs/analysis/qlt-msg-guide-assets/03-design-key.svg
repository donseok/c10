<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="910" viewBox="0 0 1100 910" role="img" aria-labelledby="title desc"><title id="title">설계Key 열세 조건</title><desc id="desc">품질메세지를 결정하는 설계Key 조건 열세 개와 그중 넓힐 수 있는 선택 조건 네 개.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="910" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="30" fill="#17324d" font-weight="700">메세지를 결정하는 조건은 열세 개입니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">이 열세 값을 한 배열로 묶어 설계Key기준에 넘기고, 맞는 줄 하나를 받아 옵니다</text>
<rect x="35" y="120" width="1030" height="46" fill="#e3eef2"/><text x="45" y="150" font-size="19" fill="#17324d" font-weight="700">자리</text><text x="125" y="150" font-size="19" fill="#17324d" font-weight="700">조건 항목</text><text x="425" y="150" font-size="19" fill="#17324d" font-weight="700">주문에서 오는 값</text><text x="805" y="150" font-size="19" fill="#17324d" font-weight="700">Match 성격</text><rect x="35" y="166" width="1030" height="42" fill="#fff" stroke="#b7c8d5"/><text x="45" y="194" font-size="19" fill="#17324d" font-weight="400">0</text><text x="125" y="194" font-size="19" fill="#17324d" font-weight="400">품명</text><text x="425" y="194" font-size="19" fill="#17324d" font-weight="400">PRD_NM_CD</text><text x="805" y="194" font-size="19" fill="#17324d" font-weight="700">필수</text><rect x="35" y="208" width="1030" height="42" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="236" font-size="19" fill="#17324d" font-weight="400">1</text><text x="125" y="236" font-size="19" fill="#17324d" font-weight="400">제품형태</text><text x="425" y="236" font-size="19" fill="#17324d" font-weight="400">PRD_SHP</text><text x="805" y="236" font-size="19" fill="#17324d" font-weight="700">필수</text><rect x="35" y="250" width="1030" height="42" fill="#fff" stroke="#b7c8d5"/><text x="45" y="278" font-size="19" fill="#17324d" font-weight="400">2</text><text x="125" y="278" font-size="19" fill="#17324d" font-weight="400">규격약호</text><text x="425" y="278" font-size="19" fill="#17324d" font-weight="400">SPC_AVR</text><text x="805" y="278" font-size="19" fill="#17324d" font-weight="700">필수</text><rect x="35" y="292" width="1030" height="42" fill="#fff8ee" stroke="#b7c8d5"/><text x="45" y="320" font-size="19" fill="#17324d" font-weight="400">3</text><text x="125" y="320" font-size="19" fill="#17324d" font-weight="400">주문용도코드</text><text x="425" y="320" font-size="19" fill="#17324d" font-weight="400">ORD_USG_CD</text><text x="805" y="320" font-size="19" fill="#17324d" font-weight="700">선택 · 3단계로 넓힘</text><rect x="35" y="334" width="1030" height="42" fill="#fff8ee" stroke="#b7c8d5"/><text x="45" y="362" font-size="19" fill="#17324d" font-weight="400">4</text><text x="125" y="362" font-size="19" fill="#17324d" font-weight="400">최종고객사코드</text><text x="425" y="362" font-size="19" fill="#17324d" font-weight="400">FNL_CUS_CD</text><text x="805" y="362" font-size="19" fill="#17324d" font-weight="700">선택 · * 로 넓힘</text><rect x="35" y="376" width="1030" height="42" fill="#fff8ee" stroke="#b7c8d5"/><text x="45" y="404" font-size="19" fill="#17324d" font-weight="400">5</text><text x="125" y="404" font-size="19" fill="#17324d" font-weight="400">고객사양번호</text><text x="425" y="404" font-size="19" fill="#17324d" font-weight="400">CUS_BTH_PAP_NO</text><text x="805" y="404" font-size="19" fill="#17324d" font-weight="700">선택 · * 로 넓힘</text><rect x="35" y="418" width="1030" height="42" fill="#fff" stroke="#b7c8d5"/><text x="45" y="446" font-size="19" fill="#17324d" font-weight="400">6</text><text x="125" y="446" font-size="19" fill="#17324d" font-weight="400">엠보스무늬</text><text x="425" y="446" font-size="19" fill="#17324d" font-weight="400">EMBS_CD</text><text x="805" y="446" font-size="19" fill="#17324d" font-weight="700">필수</text><rect x="35" y="460" width="1030" height="42" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="488" font-size="19" fill="#17324d" font-weight="400">7</text><text x="125" y="488" font-size="19" fill="#17324d" font-weight="400">주문Spangle구분</text><text x="425" y="488" font-size="19" fill="#17324d" font-weight="400">ORD_SPNL_TP</text><text x="805" y="488" font-size="19" fill="#17324d" font-weight="700">필수</text><rect x="35" y="502" width="1030" height="42" fill="#fff" stroke="#b7c8d5"/><text x="45" y="530" font-size="19" fill="#17324d" font-weight="400">8</text><text x="125" y="530" font-size="19" fill="#17324d" font-weight="400">주문도금량지정코드</text><text x="425" y="530" font-size="19" fill="#17324d" font-weight="400">GW_ASG_CD</text><text x="805" y="530" font-size="19" fill="#17324d" font-weight="700">필수</text><rect x="35" y="544" width="1030" height="42" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="572" font-size="19" fill="#17324d" font-weight="400">9</text><text x="125" y="572" font-size="19" fill="#17324d" font-weight="400">주문표면처리코드</text><text x="425" y="572" font-size="19" fill="#17324d" font-weight="400">ORD_SUR_HND_CD</text><text x="805" y="572" font-size="19" fill="#17324d" font-weight="700">필수</text><rect x="35" y="586" width="1030" height="42" fill="#fff8ee" stroke="#b7c8d5"/><text x="45" y="614" font-size="19" fill="#17324d" font-weight="400">10</text><text x="125" y="614" font-size="19" fill="#17324d" font-weight="400">색상코드</text><text x="425" y="614" font-size="19" fill="#17324d" font-weight="400">CCL BOM 번호 앞 5자리</text><text x="805" y="614" font-size="19" fill="#17324d" font-weight="700">선택 · * 로 넓힘</text><rect x="35" y="628" width="1030" height="42" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="656" font-size="19" fill="#17324d" font-weight="400">11</text><text x="125" y="656" font-size="19" fill="#17324d" font-weight="400">주문두께</text><text x="425" y="656" font-size="19" fill="#17324d" font-weight="400">ORD_EXC_THK</text><text x="805" y="656" font-size="19" fill="#17324d" font-weight="700">필수 · 범위 비교</text><rect x="35" y="670" width="1030" height="42" fill="#fff" stroke="#b7c8d5"/><text x="45" y="698" font-size="19" fill="#17324d" font-weight="400">12</text><text x="125" y="698" font-size="19" fill="#17324d" font-weight="400">주문폭</text><text x="425" y="698" font-size="19" fill="#17324d" font-weight="400">아래 설명 참조</text><text x="805" y="698" font-size="19" fill="#17324d" font-weight="700">필수 · 범위 비교</text>
<rect x="35" y="730" width="505" height="150" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="51" y="762" font-size="22" fill="#17324d" font-weight="700">주문폭은 그대로 쓰지 않습니다</text><text x="51" y="792" font-size="18" fill="#17324d" font-weight="400">Slit 조수가 0보다 크면 조합폭 1~10 을 모두 더한 값을 주문폭으로 씁니다.</text><text x="51" y="818" font-size="18" fill="#17324d" font-weight="400">그렇지 않을 때만 주문폭 컬럼을 그대로 씁니다.</text><text x="51" y="844" font-size="18" fill="#17324d" font-weight="400">→ 조합폭을 고치면 맞는 기준 줄이 바뀔 수 있습니다.</text>
<rect x="560" y="730" width="505" height="150" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="576" y="762" font-size="22" fill="#17324d" font-weight="700">노란 네 줄이 “선택 조건”입니다</text><text x="576" y="792" font-size="18" fill="#17324d" font-weight="400">맞는 줄이 없으면 이 네 가지를 차례로 * 로 바꾸며</text><text x="576" y="818" font-size="18" fill="#17324d" font-weight="400">다시 찾습니다. 그래서 주문이 달라도 같은 메세지가</text><text x="576" y="844" font-size="18" fill="#17324d" font-weight="400">붙을 수 있습니다. 넓히는 순서는 다음 그림에.</text></g></svg>
