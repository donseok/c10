<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc"><title id="title">기준값이 저장값으로 옮겨지는 경로</title><desc id="desc">기준의 세 번째 메세지는 QLT_MSG_NM2 라는 이름으로 담기는데 저장 단계는 QLT_MSG_NM3 을 찾아 값을 잃는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="670" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="30" fill="#17324d" font-weight="700">기준의 메세지 칸이 저장용 값으로 옮겨지는 경로</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">이 옮김이 한 칸 밀려 있습니다. 그래서 마지막 갈래가 저장 단계에서 길을 잃습니다</text>
<rect x="35" y="120" width="1030" height="48" fill="#e3eef2"/><text x="45" y="150" font-size="19" fill="#17324d" font-weight="700">기준(C10B1040)의 칸</text><text x="325" y="150" font-size="19" fill="#17324d" font-weight="700">→ 담기는 이름</text><text x="605" y="150" font-size="19" fill="#17324d" font-weight="700">저장할 때 찾는 이름</text><text x="885" y="150" font-size="19" fill="#17324d" font-weight="700">결과</text><rect x="35" y="168" width="1030" height="52" fill="#fff" stroke="#b7c8d5"/><text x="45" y="201" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM1</text><text x="325" y="201" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM</text><text x="605" y="201" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM</text><text x="885" y="201" font-size="19" fill="#1b6b54" font-weight="700">맞음</text><rect x="35" y="220" width="1030" height="52" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="253" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM2</text><text x="325" y="253" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM1</text><text x="605" y="253" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM1</text><text x="885" y="253" font-size="19" fill="#1b6b54" font-weight="700">맞음</text><rect x="35" y="272" width="1030" height="52" fill="#fdecea" stroke="#b7c8d5"/><text x="45" y="305" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM3</text><text x="325" y="305" font-size="19" fill="#b3261e" font-weight="700">QLT_MSG_NM2</text><text x="605" y="305" font-size="19" fill="#b3261e" font-weight="700">QLT_MSG_NM3</text><text x="885" y="305" font-size="19" fill="#b3261e" font-weight="700">어긋남</text><rect x="35" y="324" width="1030" height="52" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="357" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM_COR</text><text x="325" y="357" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM_COR</text><text x="605" y="357" font-size="19" fill="#17324d" font-weight="400">QLT_MSG_NM_COR</text><text x="885" y="357" font-size="19" fill="#1b6b54" font-weight="700">맞음</text>
<rect x="35" y="360" width="1030" height="150" rx="12" fill="#fdecea" stroke="#b7c8d5"/><text x="51" y="392" font-size="22" fill="#17324d" font-weight="700">세 번째 줄만 이름이 다릅니다</text><text x="51" y="422" font-size="19" fill="#17324d" font-weight="400">기준의 세 번째 메세지는 “QLT_MSG_NM2”라는 이름으로 담깁니다. 그런데 저장 단계는 “QLT_MSG_NM3”이라는 이름을 찾습니다.</text><text x="51" y="448" font-size="19" fill="#17324d" font-weight="400">그 이름으로 담긴 값은 어디에도 없습니다. 저장소 전체를 찾아봐도 그 이름으로 값을 담는 곳이 없습니다.</text><text x="51" y="474" font-size="19" fill="#17324d" font-weight="400">찾지 못하면 빈 문자열을 대신 넣습니다. 그리고 Oracle 은 빈 문자열을 NULL 로 저장합니다.</text>
<rect x="35" y="530" width="1030" height="110" rx="12" fill="#fff4e7" stroke="#b7c8d5"/>
<text x="55" y="566" font-size="23" fill="#17324d" font-weight="700">눈에 보이는 증상</text>
<text x="55" y="600" font-size="19" fill="#17324d" font-weight="400">차선2(제조구분 3) 행은 만들어지기는 하지만 메세지 칸이 늘 비어 있습니다. 기준에 문구를 넣어도 화면에 나타나지 않습니다.</text>
<text x="55" y="628" font-size="19" fill="#516579" font-weight="400">적정과 차선1 은 정상입니다. 그래서 “기준 등록이 잘못됐나” 하고 기준부터 들여다보기 쉽습니다.</text></g></svg>
