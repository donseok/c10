<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1010" viewBox="0 0 1100 1010" role="img" aria-labelledby="title desc"><title id="title">우선순위 Match 하강 순서</title><desc id="desc">맞는 기준 줄이 없으면 주문용도코드·고객사코드·색상코드를 안쪽부터 차례로 넓혀 다시 찾는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="1010" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="30" fill="#17324d" font-weight="700">맞는 줄이 없으면 조건을 넓혀 다시 찾습니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">자동차 주행거리계처럼 안쪽 자리부터 올리고, 다 차면 한 칸 위를 올린 뒤 안쪽을 되돌립니다</text>
<rect x="430" y="120" width="240" height="48" rx="24" fill="#007f86"/><text x="550" y="150" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">열세 조건으로 조회</text>
<path d="M550 168V206" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="550,206 700,250 550,294 400,250" fill="#e2f1f0" stroke="#b7c8d5"/><text x="550" y="256" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">맞는 줄이 있는가</text>
<path d="M700 250H900V300" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="712" y="240" font-size="18" fill="#007f86" font-weight="700">있음</text>
<rect x="770" y="300" width="260" height="96" rx="12" fill="#e4f4ef" stroke="#b7c8d5"/>
<text x="790" y="336" font-size="21" fill="#17324d" font-weight="700">ctx 로 옮기고 종료</text>
<text x="790" y="368" font-size="18" fill="#516579" font-weight="400">메세지 저장 단계로</text>
<path d="M550 294V330" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="566" y="320" font-size="18" fill="#b3261e" font-weight="700">없음</text>
<polygon points="400,332 565,376 400,420 235,376" fill="#fdecea" stroke="#b7c8d5"/><text x="400" y="371" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">고객사양번호가</text><text x="400" y="393" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">주문에 지정돼 있는가</text>
<path d="M565 376H700V420" fill="none" stroke="#b3261e" stroke-width="3" marker-end="url(#arrow)"/>
<text x="578" y="366" font-size="18" fill="#b3261e" font-weight="700">지정</text>
<rect x="700" y="420" width="330" height="84" rx="12" fill="#fdecea" stroke="#b7c8d5"/>
<text x="720" y="454" font-size="21" fill="#b3261e" font-weight="700">즉시 실패 · 에러코드 KK01</text>
<text x="720" y="484" font-size="18" fill="#516579" font-weight="400">넓히지 않습니다</text>
<path d="M400 420V456" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="416" y="446" font-size="17" fill="#516579" font-weight="400">미지정(********** 로 대체됨)</text>
<rect x="35" y="456" width="730" height="300" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="55" y="492" font-size="23" fill="#17324d" font-weight="700">넓히는 순서 — 안쪽 자리부터</text>
<rect x="55" y="520" width="690" height="62" rx="12" fill="#fff" stroke="#b7c8d5"/>
<text x="75" y="560" font-size="21" fill="#17324d" font-weight="700">③ 색상코드</text>
<text x="300" y="560" font-size="18" fill="#516579" font-weight="400">가장 바깥</text>
<text x="430" y="560" font-size="18" fill="#17324d" font-weight="400">CCL BOM 앞 5자리 → *****</text>
<rect x="55" y="594" width="690" height="62" rx="12" fill="#fff" stroke="#b7c8d5"/>
<text x="75" y="634" font-size="21" fill="#17324d" font-weight="700">② 최종고객사코드</text>
<text x="300" y="634" font-size="18" fill="#516579" font-weight="400">가운데</text>
<text x="430" y="634" font-size="18" fill="#17324d" font-weight="400">실제 코드 → ******</text>
<rect x="55" y="668" width="690" height="62" rx="12" fill="#fff4e7" stroke="#b7c8d5"/>
<text x="75" y="708" font-size="21" fill="#17324d" font-weight="700">① 주문용도코드</text>
<text x="300" y="708" font-size="18" fill="#516579" font-weight="400">가장 안쪽</text>
<text x="430" y="708" font-size="18" fill="#17324d" font-weight="400">3단계로 넓힘 (다음 그림)</text>
<text x="55" y="742" font-size="18" fill="#516579" font-weight="400">①이 끝까지 넓혀지면 ②를 한 칸 올리고 ①을 원래 값으로 되돌린 뒤 다시 시작합니다.</text>
<path d="M400 756V800" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="390" y="800" width="320" height="48" rx="24" fill="#5a6b7d"/><text x="550" y="830" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">넓힌 값으로 다시 조회</text>
<path d="M390 824H100V144H430" fill="none" stroke="#516579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="112" y="136" font-size="18" fill="#516579" font-weight="700">되돌아가 반복</text>
<rect x="35" y="880" width="1030" height="100" rx="12" fill="#fdecea" stroke="#b7c8d5"/><text x="51" y="912" font-size="22" fill="#17324d" font-weight="700">셋 다 끝까지 넓혔는데도 못 찾으면</text><text x="51" y="942" font-size="19" fill="#17324d" font-weight="400">주문용도코드가 ****** 이고 고객사코드도 ****** 이고 색상코드도 ***** 인 상태에서 실패하면 에러코드 KK01 로 끝납니다.</text><text x="51" y="968" font-size="19" fill="#17324d" font-weight="400">반대로 맞는 줄이 두 줄 이상이면 에러코드 KK02 입니다. 기준이 중복 등록된 경우입니다.</text></g></svg>
