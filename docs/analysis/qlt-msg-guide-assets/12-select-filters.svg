<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="872" viewBox="0 0 1100 872" role="img" aria-labelledby="title desc"><title id="title">탭별 메세지 조회 필터</title><desc id="desc">세 탭의 메세지 조회 조건이 다르고, 종료주문 필터는 후공정 탭에만 있다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="872" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="30" fill="#17324d" font-weight="700">메세지가 안 보일 때 — 조회 필터부터 봅니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">세 탭의 메세지 조회 SQL 은 WHERE 절이 서로 다릅니다. 종료주문 필터는 한 곳에만 있습니다</text>
<rect x="35" y="120" width="1030" height="50" fill="#e3eef2"/><text x="45" y="150" font-size="19" fill="#17324d" font-weight="700">탭</text><text x="275" y="150" font-size="19" fill="#17324d" font-weight="700">읽는 표</text><text x="525" y="150" font-size="19" fill="#17324d" font-weight="700">제조구분 조건</text><text x="815" y="150" font-size="19" fill="#17324d" font-weight="700">종료주문 필터</text><rect x="35" y="170" width="1030" height="58" fill="#eef7f8" stroke="#b7c8d5"/><text x="45" y="206" font-size="19" fill="#17324d" font-weight="400">용융도금 TAB05</text><text x="275" y="206" font-size="19" fill="#17324d" font-weight="400">MSG</text><text x="525" y="206" font-size="19" fill="#17324d" font-weight="400">화면이 넘긴 값</text><text x="815" y="206" font-size="19" fill="#17324d" font-weight="400">없음</text><rect x="35" y="228" width="1030" height="58" fill="#f2f5f8" stroke="#b7c8d5"/><text x="45" y="264" font-size="19" fill="#17324d" font-weight="400">전기도금 TAB06</text><text x="275" y="264" font-size="19" fill="#17324d" font-weight="400">MSG</text><text x="525" y="264" font-size="19" fill="#17324d" font-weight="400">'1' 로 고정</text><text x="815" y="264" font-size="19" fill="#17324d" font-weight="400">없음</text><rect x="35" y="286" width="1030" height="58" fill="#e4f4ef" stroke="#b7c8d5"/><text x="45" y="322" font-size="19" fill="#17324d" font-weight="400">후공정 TAB09</text><text x="275" y="322" font-size="19" fill="#17324d" font-weight="400">MSG1</text><text x="525" y="322" font-size="19" fill="#17324d" font-weight="400">(컬럼 자체가 없음)</text><text x="815" y="322" font-size="19" fill="#b3261e" font-weight="700">있음</text>
<rect x="35" y="320" width="1030" height="120" rx="12" fill="#fdecea" stroke="#b7c8d5"/>
<text x="55" y="356" font-size="23" fill="#17324d" font-weight="700">후공정 탭에만 걸린 필터</text>
<text x="55" y="392" font-size="19" fill="#17324d" font-weight="400">주문이 종료 처리되어 있으면 조회 결과가 0건이 됩니다. 설계가 정상이어도 메세지 칸이 통째로 빕니다.</text>
<text x="55" y="422" font-size="19" fill="#516579" font-weight="400">같은 주문에서 용융·전기 탭은 메세지가 보이는데 후공정 탭만 비어 보이는 상황이 이 때문입니다.</text>
<polygon points="280,470 490,510 280,550 70,510" fill="#fbe3e0" stroke="#b7c8d5"/><text x="280" y="516" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">같은 주문인데 후공정 탭만 비었는가</text>
<path d="M490 510H700" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="700" y="470" width="365" height="80" rx="12" fill="#fff4e7" stroke="#b7c8d5"/>
<text x="718" y="518" font-size="21" fill="#17324d" font-weight="700">종료주문 여부부터 확인</text>
<path d="M280 550V610" fill="none" stroke="#516579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="296" y="596" font-size="18" fill="#516579" font-weight="400">아니오</text>
<rect x="35" y="610" width="630" height="80" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="55" y="658" font-size="21" fill="#17324d" font-weight="700">세 탭 모두 비었다면 표에 행이 없는 것입니다</text>
<rect x="35" y="710" width="1030" height="132" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="51" y="742" font-size="22" fill="#17324d" font-weight="700">전기도금 탭이 비어 보이는 다른 이유</text><text x="51" y="772" font-size="19" fill="#17324d" font-weight="400">전기도금 탭은 적정(제조구분 1)만 읽습니다. 적정 행이 없고 차선만 있는 주문이면 이 탭에서는 아무것도 안 보입니다.</text><text x="51" y="798" font-size="19" fill="#17324d" font-weight="400">그런 주문에서도 용융도금 탭은 차선을 골라 메세지를 볼 수 있습니다.</text><text x="51" y="824" font-size="19" fill="#17324d" font-weight="400">탭마다 보이는 범위가 다르다는 점을 기억하면 “화면 버그”로 오해하지 않습니다.</text></g></svg>
