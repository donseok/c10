<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">CCL 공정품질메시지</title><desc id="desc">CCL 공정품질메시지는 칼라 BOM 표의 다른 컬럼이며 만드는 단계와 편집 화면이 앞의 세 갈래와 다르다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="700" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="30" fill="#17324d" font-weight="700">칼라 제품에는 메세지가 하나 더 있습니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">앞의 세 갈래와 표도 컬럼도 만드는 단계도 다릅니다. 이름만 “품질메시지”로 같습니다</text>
<rect x="35" y="120" width="1060" height="48" fill="#e3eef2"/><text x="45" y="150" font-size="19" fill="#17324d" font-weight="700"></text><text x="275" y="150" font-size="19" fill="#17324d" font-weight="700">앞의 세 갈래</text><text x="675" y="150" font-size="19" fill="#17324d" font-weight="700">CCL 공정품질메시지</text><rect x="35" y="168" width="1060" height="50" fill="#fff" stroke="#b7c8d5"/><text x="45" y="200" font-size="19" fill="#17324d" font-weight="400">표</text><text x="275" y="200" font-size="19" fill="#17324d" font-weight="400">MSG · MSG1 · MSG_PKG</text><text x="675" y="200" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_CCL_BOM</text><rect x="35" y="218" width="1060" height="50" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="250" font-size="19" fill="#17324d" font-weight="400">컬럼</text><text x="275" y="250" font-size="19" fill="#17324d" font-weight="700">QLT_MSG_NM</text><text x="675" y="250" font-size="19" fill="#17324d" font-weight="700">CCL_QLT_MSG_TXT</text><rect x="35" y="268" width="1060" height="50" fill="#fff" stroke="#b7c8d5"/><text x="45" y="300" font-size="19" fill="#17324d" font-weight="400">만드는 단계</text><text x="275" y="300" font-size="19" fill="#17324d" font-weight="400">설계Key (C102100020)</text><text x="675" y="300" font-size="19" fill="#17324d" font-weight="400">CCL제조사양 (C102100160)</text><rect x="35" y="318" width="1060" height="50" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="350" font-size="19" fill="#17324d" font-weight="400">한 주문당</text><text x="275" y="350" font-size="19" fill="#17324d" font-weight="400">제조구분별 · 정전 · 포장</text><text x="675" y="350" font-size="19" fill="#17324d" font-weight="400">칼라 BOM 행마다</text><rect x="35" y="368" width="1060" height="50" fill="#fff" stroke="#b7c8d5"/><text x="45" y="400" font-size="19" fill="#17324d" font-weight="400">편집 화면</text><text x="275" y="400" font-size="19" fill="#17324d" font-weight="400">TAB05 · TAB06 · TAB09</text><text x="675" y="400" font-size="19" fill="#17324d" font-weight="400">TAB07</text><rect x="35" y="418" width="1060" height="50" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="450" font-size="19" fill="#17324d" font-weight="400">변경이력</text><text x="275" y="450" font-size="19" fill="#17324d" font-weight="400">남음</text><text x="675" y="450" font-size="19" fill="#17324d" font-weight="400">남음</text><rect x="35" y="468" width="1060" height="50" fill="#fff" stroke="#b7c8d5"/><text x="45" y="500" font-size="19" fill="#17324d" font-weight="400">반복주문 복사</text><text x="275" y="500" font-size="19" fill="#17324d" font-weight="400">MSG · MSG1 만 복사</text><text x="675" y="500" font-size="19" fill="#17324d" font-weight="400">별도 경로로 복사</text>
<rect x="35" y="520" width="1030" height="150" rx="12" fill="#eef0fa" stroke="#b7c8d5"/><text x="51" y="552" font-size="22" fill="#17324d" font-weight="700">왜 헷갈리는가</text><text x="51" y="582" font-size="19" fill="#17324d" font-weight="400">화면에서는 둘 다 “품질메시지”라는 라벨을 답니다. 그런데 컬럼 이름이 다르므로 SQL 로 찾을 때는 헷갈리지 않습니다.</text><text x="51" y="608" font-size="19" fill="#17324d" font-weight="400">반대로 화면만 보고 “메세지를 고쳤는데 반영이 안 된다”고 하면, 어느 탭에서 고쳤는지부터 물어야 합니다.</text><text x="51" y="634" font-size="19" fill="#17324d" font-weight="400">칼라 탭에서 고친 문구는 MSG 표에 들어가지 않고, 도금 탭에서 고친 문구는 칼라 BOM 에 들어가지 않습니다.</text></g></svg>
