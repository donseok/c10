<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="970" viewBox="0 0 1100 970" role="img" aria-labelledby="title desc"><title id="title">제조구분별 메세지 행 생성 조건</title><desc id="desc">메세지 행은 그 제조구분의 제조표준번호가 있을 때만 만들어지고, 문구가 없으면 빈 문자열이 들어간다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="970" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="30" fill="#17324d" font-weight="700">제조구분별 메세지 행이 만들어지는 조건</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">메세지가 있느냐가 아니라, 그 제조구분의 제조표준번호가 있느냐로 행을 만듭니다</text>
<text x="35" y="163" font-size="26" fill="#17324d" font-weight="700">적정</text>
<polygon points="300,137 450,177 300,217 150,177" fill="#e2f1f0" stroke="#b7c8d5"/><text x="300" y="172" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">CRM_MNF_STD_NO 이</text><text x="300" y="194" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">비어 있지 않은가</text>
<path d="M108 177H146" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M450 177H560" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="468" y="167" font-size="18" fill="#007f86" font-weight="700">예</text>
<polygon points="720,137 860,177 720,217 580,177" fill="#e2f1f0" stroke="#b7c8d5"/><text x="720" y="172" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">QLT_MSG_NM</text><text x="720" y="194" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">값이 있는가</text>
<path d="M860 177H960" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="872" y="167" font-size="18" fill="#007f86" font-weight="700">예</text>
<rect x="960" y="147" width="105" height="60" rx="12" fill="#e4f4ef" stroke="#b7c8d5"/>
<text x="978" y="183" font-size="18" fill="#1b6b54" font-weight="700">문구 저장</text>
<path d="M720 217V265H960" fill="none" stroke="#b3261e" stroke-width="3" marker-end="url(#arrow)"/>
<text x="736" y="251" font-size="18" fill="#b3261e" font-weight="700">아니오 → 빈 문자열</text>
<rect x="960" y="237" width="105" height="58" rx="12" fill="#fdecea" stroke="#b7c8d5"/>
<text x="984" y="273" font-size="18" fill="#b3261e" font-weight="700">빈칸</text>
<path d="M300 217V295" fill="none" stroke="#516579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="316" y="285" font-size="18" fill="#516579" font-weight="400">아니오 → 이 행 자체를 만들지 않음</text>
<text x="560" y="303" font-size="18" fill="#516579" font-weight="700">제조구분 1 행</text>
<text x="35" y="383" font-size="26" fill="#17324d" font-weight="700">차선1</text>
<polygon points="300,357 450,397 300,437 150,397" fill="#e2f1f0" stroke="#b7c8d5"/><text x="300" y="392" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">CRM_MNF_STD_NO1 이</text><text x="300" y="414" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">비어 있지 않은가</text>
<path d="M108 397H146" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M450 397H560" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="468" y="387" font-size="18" fill="#007f86" font-weight="700">예</text>
<polygon points="720,357 860,397 720,437 580,397" fill="#e2f1f0" stroke="#b7c8d5"/><text x="720" y="392" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">QLT_MSG_NM1</text><text x="720" y="414" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">값이 있는가</text>
<path d="M860 397H960" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="872" y="387" font-size="18" fill="#007f86" font-weight="700">예</text>
<rect x="960" y="367" width="105" height="60" rx="12" fill="#e4f4ef" stroke="#b7c8d5"/>
<text x="978" y="403" font-size="18" fill="#1b6b54" font-weight="700">문구 저장</text>
<path d="M720 437V485H960" fill="none" stroke="#b3261e" stroke-width="3" marker-end="url(#arrow)"/>
<text x="736" y="471" font-size="18" fill="#b3261e" font-weight="700">아니오 → 빈 문자열</text>
<rect x="960" y="457" width="105" height="58" rx="12" fill="#fdecea" stroke="#b7c8d5"/>
<text x="984" y="493" font-size="18" fill="#b3261e" font-weight="700">빈칸</text>
<path d="M300 437V515" fill="none" stroke="#516579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="316" y="505" font-size="18" fill="#516579" font-weight="400">아니오 → 이 행 자체를 만들지 않음</text>
<text x="560" y="523" font-size="18" fill="#516579" font-weight="700">제조구분 2 행</text>
<text x="35" y="603" font-size="26" fill="#17324d" font-weight="700">차선2</text>
<polygon points="300,577 450,617 300,657 150,617" fill="#fbe3e0" stroke="#b7c8d5"/><text x="300" y="612" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">CRM_MNF_STD_NO2 이</text><text x="300" y="634" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">비어 있지 않은가</text>
<path d="M108 617H146" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M450 617H560" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="468" y="607" font-size="18" fill="#007f86" font-weight="700">예</text>
<polygon points="720,577 860,617 720,657 580,617" fill="#fbe3e0" stroke="#b7c8d5"/><text x="720" y="612" font-size="17" fill="#17324d" font-weight="700" text-anchor="middle">QLT_MSG_NM3 (없는 이름)</text><text x="720" y="634" font-size="17" fill="#17324d" font-weight="700" text-anchor="middle">값이 있는가</text>
<path d="M860 617H960" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="872" y="607" font-size="18" fill="#007f86" font-weight="700">예</text>
<rect x="960" y="587" width="105" height="60" rx="12" fill="#e4f4ef" stroke="#b7c8d5"/>
<text x="978" y="623" font-size="18" fill="#1b6b54" font-weight="700">문구 저장</text>
<path d="M720 657V705H960" fill="none" stroke="#b3261e" stroke-width="3" marker-end="url(#arrow)"/>
<text x="736" y="691" font-size="18" fill="#b3261e" font-weight="700">아니오 → 빈 문자열</text>
<rect x="960" y="677" width="105" height="58" rx="12" fill="#fdecea" stroke="#b7c8d5"/>
<text x="984" y="713" font-size="18" fill="#b3261e" font-weight="700">빈칸</text>
<path d="M300 657V735" fill="none" stroke="#516579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="316" y="725" font-size="18" fill="#516579" font-weight="400">아니오 → 이 행 자체를 만들지 않음</text>
<text x="560" y="743" font-size="18" fill="#516579" font-weight="700">제조구분 3 행</text>
<text x="35" y="643" font-size="18" fill="#b3261e" font-weight="700">항상 빈칸</text>
<rect x="35" y="790" width="1030" height="150" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="51" y="822" font-size="22" fill="#17324d" font-weight="700">그래서 두 가지가 서로 다릅니다</text><text x="51" y="852" font-size="19" fill="#17324d" font-weight="400">행이 없다 = 그 제조구분의 제조표준 자체가 설계되지 않았다. 화면에서 그 차선을 고를 수 없습니다.</text><text x="51" y="878" font-size="19" fill="#17324d" font-weight="400">행은 있는데 메세지가 비었다 = 기준에 문구가 없거나, 차선2 처럼 옮기다 잃어버린 것입니다.</text><text x="51" y="904" font-size="19" fill="#17324d" font-weight="400">조사할 때 이 둘을 먼저 갈라야 합니다. 표에 행이 있는지부터 확인하세요.</text></g></svg>
