<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="982" viewBox="0 0 1100 982" role="img" aria-labelledby="title desc"><title id="title">메세지 여섯 갈래 표 비교</title><desc id="desc">메세지 여섯 갈래의 표, 키, 주문당 행 수, 만드는 곳, 편집 화면을 나란히 비교한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="982" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="30" fill="#17324d" font-weight="700">여섯 갈래를 한자리에 놓고 보기</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">키가 다르면 “한 주문에 몇 행이냐”가 달라집니다. 조회 결과 건수를 읽을 때 먼저 확인할 것</text>
<rect x="35" y="120" width="1030" height="48" fill="#e3eef2"/><text x="45" y="150" font-size="19" fill="#17324d" font-weight="700">갈래</text><text x="275" y="150" font-size="19" fill="#17324d" font-weight="700">표</text><text x="575" y="150" font-size="19" fill="#17324d" font-weight="700">키</text><text x="865" y="150" font-size="19" fill="#17324d" font-weight="700">한 주문당</text><rect x="35" y="168" width="1030" height="50" fill="#eef7f8" stroke="#b7c8d5"/><text x="45" y="200" font-size="19" fill="#17324d" font-weight="400">제조구분별</text><text x="275" y="200" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_MSG</text><text x="575" y="200" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행 + 제조구분</text><text x="865" y="200" font-size="19" fill="#17324d" font-weight="400">0 ~ 3행</text><rect x="35" y="218" width="1030" height="50" fill="#eaf6f2" stroke="#b7c8d5"/><text x="45" y="250" font-size="19" fill="#17324d" font-weight="400">정전</text><text x="275" y="250" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_MSG1</text><text x="575" y="250" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행</text><text x="865" y="250" font-size="19" fill="#17324d" font-weight="400">항상 1행</text><rect x="35" y="268" width="1030" height="50" fill="#fff4e7" stroke="#b7c8d5"/><text x="45" y="300" font-size="19" fill="#17324d" font-weight="400">포장</text><text x="275" y="300" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_MSG_PKG</text><text x="575" y="300" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행</text><text x="865" y="300" font-size="19" fill="#17324d" font-weight="400">0 또는 1행</text><rect x="35" y="318" width="1030" height="50" fill="#eef0fa" stroke="#b7c8d5"/><text x="45" y="350" font-size="19" fill="#17324d" font-weight="400">CCL 공정</text><text x="275" y="350" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_CCL_BOM</text><text x="575" y="350" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행 + BOM 순번</text><text x="865" y="350" font-size="19" fill="#17324d" font-weight="400">BOM 행마다</text><rect x="35" y="368" width="1030" height="50" fill="#f2f5f8" stroke="#b7c8d5"/><text x="45" y="400" font-size="19" fill="#17324d" font-weight="400">지관발주</text><text x="275" y="400" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_CMN</text><text x="575" y="400" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행</text><text x="865" y="400" font-size="19" fill="#17324d" font-weight="400">1칸</text><rect x="35" y="418" width="1030" height="50" fill="#f2f5f8" stroke="#b7c8d5"/><text x="45" y="450" font-size="19" fill="#17324d" font-weight="400">PE-FOAM</text><text x="275" y="450" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_CMN</text><text x="575" y="450" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행</text><text x="865" y="450" font-size="19" fill="#17324d" font-weight="400">1칸</text>
<rect x="35" y="470" width="1030" height="48" fill="#e3eef2"/><text x="45" y="500" font-size="19" fill="#17324d" font-weight="700">갈래</text><text x="275" y="500" font-size="19" fill="#17324d" font-weight="700">만드는 곳</text><text x="615" y="500" font-size="19" fill="#17324d" font-weight="700">화면</text><text x="865" y="500" font-size="19" fill="#17324d" font-weight="700">고칠 수 있나</text><rect x="35" y="518" width="1030" height="50" fill="#eef7f8" stroke="#b7c8d5"/><text x="45" y="550" font-size="19" fill="#17324d" font-weight="400">제조구분별</text><text x="275" y="550" font-size="19" fill="#17324d" font-weight="400">자동설계 설계Key 단계</text><text x="615" y="550" font-size="19" fill="#17324d" font-weight="400">TAB05 · TAB06</text><text x="865" y="550" font-size="19" fill="#17324d" font-weight="400">예</text><rect x="35" y="568" width="1030" height="50" fill="#eaf6f2" stroke="#b7c8d5"/><text x="45" y="600" font-size="19" fill="#17324d" font-weight="400">정전</text><text x="275" y="600" font-size="19" fill="#17324d" font-weight="400">자동설계 설계Key 단계</text><text x="615" y="600" font-size="19" fill="#17324d" font-weight="400">TAB09</text><text x="865" y="600" font-size="19" fill="#17324d" font-weight="400">예</text><rect x="35" y="618" width="1030" height="50" fill="#fff4e7" stroke="#b7c8d5"/><text x="45" y="650" font-size="19" fill="#17324d" font-weight="400">포장</text><text x="275" y="650" font-size="19" fill="#b3261e" font-weight="700">이 저장소에 없음</text><text x="615" y="650" font-size="19" fill="#17324d" font-weight="400">TAB09</text><text x="865" y="650" font-size="19" fill="#17324d" font-weight="400">아니오 · 코드만</text><rect x="35" y="668" width="1030" height="50" fill="#eef0fa" stroke="#b7c8d5"/><text x="45" y="700" font-size="19" fill="#17324d" font-weight="400">CCL 공정</text><text x="275" y="700" font-size="19" fill="#17324d" font-weight="400">자동설계 CCL제조사양 단계</text><text x="615" y="700" font-size="19" fill="#17324d" font-weight="400">TAB07</text><text x="865" y="700" font-size="19" fill="#17324d" font-weight="400">예</text><rect x="35" y="718" width="1030" height="50" fill="#f2f5f8" stroke="#b7c8d5"/><text x="45" y="750" font-size="19" fill="#17324d" font-weight="400">지관발주</text><text x="275" y="750" font-size="19" fill="#17324d" font-weight="400">자동설계 CCL제조사양 단계</text><text x="615" y="750" font-size="19" fill="#17324d" font-weight="400">TAB01</text><text x="865" y="750" font-size="19" fill="#17324d" font-weight="400">예</text><rect x="35" y="768" width="1030" height="50" fill="#f2f5f8" stroke="#b7c8d5"/><text x="45" y="800" font-size="19" fill="#17324d" font-weight="400">PE-FOAM</text><text x="275" y="800" font-size="19" fill="#17324d" font-weight="400">자동설계 CCL제조사양 단계</text><text x="615" y="800" font-size="19" fill="#17324d" font-weight="400">TAB01</text><text x="865" y="800" font-size="19" fill="#17324d" font-weight="400">아니오</text>
<rect x="35" y="820" width="1030" height="132" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="51" y="852" font-size="22" fill="#17324d" font-weight="700">표 이름이 헷갈리기 쉽습니다</text><text x="51" y="882" font-size="19" fill="#17324d" font-weight="400">MSG 와 MSG1 은 이름이 한 글자 차이인데 담는 것이 다릅니다. MSG 는 제조구분별, MSG1 은 정전용입니다.</text><text x="51" y="908" font-size="19" fill="#17324d" font-weight="400">MSG1 에는 제조구분 컬럼이 아예 없습니다. 그래서 후공정 화면에는 적정·차선 개념이 없습니다.</text><text x="51" y="934" font-size="19" fill="#17324d" font-weight="400">지관발주와 PE-FOAM 은 별도 표가 아니라 설계공통 표의 컬럼입니다. 주문 한 건에 한 칸씩입니다.</text></g></svg>
