<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 602" role="img"><title>두께·길이와 일반 품명의 폭: 상하한을 한 쌍으로 판단</title><desc>고객 양쪽 모두 빈값: 고객 [빈값, 빈값] / 규격 [−2, +3] → [−2, +3] / 고객 한쪽만 있음: 고객 [빈값, +2] / 규격 [−2, +3] → [빈값, +2] / 고객 양쪽 있음: 고객 [−3, +4] / 규격 [−2, +3] → [−3, +4] / 읽는 방법: 한쪽만 비어 있어도 규격값으로 채우지 않음. 항상 엄격한 쪽을 고르는 규칙이 아님</desc><rect width="1100" height="602" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="46" font-size="30" fill="#17324d">두께·길이와 일반 품명의 폭: 상하한을 한 쌍으로 판단</text><rect x="30" y="80" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="114" font-size="25" fill="#17324d">고객 양쪽 모두 빈값</text><text x="50" y="147" font-size="21" fill="#17324d">고객 [빈값, 빈값] / 규격 [−2, +3] → [−2, +3]</text><text x="535" y="191" font-size="24" fill="#007f86">↓</text><rect x="30" y="193" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="227" font-size="25" fill="#17324d">고객 한쪽만 있음</text><text x="50" y="260" font-size="21" fill="#17324d">고객 [빈값, +2] / 규격 [−2, +3] → [빈값, +2]</text><text x="535" y="304" font-size="24" fill="#007f86">↓</text><rect x="30" y="306" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="340" font-size="25" fill="#17324d">고객 양쪽 있음</text><text x="50" y="373" font-size="21" fill="#17324d">고객 [−3, +4] / 규격 [−2, +3] → [−3, +4]</text><text x="535" y="417" font-size="24" fill="#007f86">↓</text><rect x="30" y="419" width="1040" height="88" rx="10" fill="#eef7f8" stroke="#b7c8d5"/><text x="50" y="453" font-size="25" fill="#17324d">읽는 방법</text><text x="50" y="486" font-size="21" fill="#17324d">한쪽만 비어 있어도 규격값으로 채우지 않음. 항상 엄격한 쪽을 고르는 규칙이 아님</text><text x="30" y="584" font-size="19" fill="#516579">설명용 도식 · 숫자는 운영 기준값이 아닙니다.</text></g></svg>