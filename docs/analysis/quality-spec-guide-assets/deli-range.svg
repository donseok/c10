<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 442" role="img"><title>같은 주문폭에도 공차가 바뀌면 허용범위가 달라집니다</title><rect width="1100" height="442" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="45" font-size="30" fill="#17324d">같은 주문폭에도 공차가 바뀌면 허용범위가 달라집니다</text><text x="30" y="80" font-size="21" fill="#17324d">가로 막대는 허용되는 범위입니다. 마지막 행에서 함께 허용되는 구간을 읽습니다.</text><text x="30" y="150" font-size="24" fill="#17324d">규격 예시</text><line x1="280" y1="140" x2="990" y2="140" stroke="#d6e0e8"/><rect x="381.42857142857144" y="120" width="507.1428571428571" height="36" rx="10" fill="#d8e6ee" stroke="#b7c8d5"/><text x="280" y="185" font-size="21" fill="#17324d">998 ~ 1003 mm</text><text x="30" y="244" font-size="24" fill="#17324d">고객 예시</text><line x1="280" y1="234" x2="990" y2="234" stroke="#d6e0e8"/><rect x="482.85714285714283" y="214" width="304.2857142857143" height="36" rx="10" fill="#d8e6ee" stroke="#b7c8d5"/><text x="280" y="279" font-size="21" fill="#17324d">999 ~ 1002 mm</text><text x="30" y="338" font-size="24" fill="#17324d">E/C/D 보증</text><line x1="280" y1="328" x2="990" y2="328" stroke="#d6e0e8"/><rect x="482.85714285714283" y="308" width="304.2857142857143" height="36" rx="10" fill="#a4dbd4" stroke="#b7c8d5"/><text x="280" y="373" font-size="21" fill="#17324d">999 ~ 1002 mm</text><text x="30" y="430" font-size="20" fill="#17324d">가상 예제 · 0 또는 빈값이 있는 경우에는 별도 처리 규칙을 확인하세요.</text></g></svg>