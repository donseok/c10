<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 602" role="img"><title>규격 인수도 사양은 두 번 조회합니다</title><desc>① 규격 공통 조회: 규격약호 + 연도 → VI_M00_C10A1010 → 인수도규격 ACPT_RT_SPC / ② 인수도 기준 조회: 인수도규격·품명·제품형태·Edge·환산두께·환산폭·환산길이 → C10B1013 / ③ 규격 사양 저장: 치수공차 6개 + 형상값 8개 → DLV 사양구분 2 / ④ 고객과 보증 편성: 고객 인수도 경로 결과를 DLV 1에 저장한 뒤 규격과 비교하여 DLV 4 생성</desc><rect width="1100" height="602" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="46" font-size="30" fill="#17324d">규격 인수도 사양은 두 번 조회합니다</text><rect x="30" y="80" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="114" font-size="25" fill="#17324d">① 규격 공통 조회</text><text x="50" y="147" font-size="21" fill="#17324d">규격약호 + 연도 → VI_M00_C10A1010 → 인수도규격 ACPT_RT_SPC</text><text x="535" y="191" font-size="24" fill="#007f86">↓</text><rect x="30" y="193" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="227" font-size="25" fill="#17324d">② 인수도 기준 조회</text><text x="50" y="260" font-size="21" fill="#17324d">인수도규격·품명·제품형태·Edge·환산두께·환산폭·환산길이 → C10B1013</text><text x="535" y="304" font-size="24" fill="#007f86">↓</text><rect x="30" y="306" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="340" font-size="25" fill="#17324d">③ 규격 사양 저장</text><text x="50" y="373" font-size="21" fill="#17324d">치수공차 6개 + 형상값 8개 → DLV 사양구분 2</text><text x="535" y="417" font-size="24" fill="#007f86">↓</text><rect x="30" y="419" width="1040" height="88" rx="10" fill="#eef7f8" stroke="#b7c8d5"/><text x="50" y="453" font-size="25" fill="#17324d">④ 고객과 보증 편성</text><text x="50" y="486" font-size="21" fill="#17324d">고객 인수도 경로 결과를 DLV 1에 저장한 뒤 규격과 비교하여 DLV 4 생성</text><text x="30" y="584" font-size="19" fill="#516579">설명용 도식 · 숫자는 운영 기준값이 아닙니다.</text></g></svg>