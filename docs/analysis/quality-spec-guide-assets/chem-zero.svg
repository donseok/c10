<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 489" role="img"><title>빈값과 0은 똑같은 숫자 경계로 취급되지 않습니다</title><desc>빈값과 숫자 비교: numCompare(null, 0.10, false) → 0.10 / 0과 숫자 비교: numCompare(0, 0.10, false) → 0.10 (최솟값 0이 아님) / 둘 다 0 또는 한쪽만 0: 0과 0은 0 / null과 0은 0 → 모든 0을 null로 바꾸는 함수도 아님</desc><rect width="1100" height="489" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="46" font-size="30" fill="#17324d">빈값과 0은 똑같은 숫자 경계로 취급되지 않습니다</text><rect x="30" y="80" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="114" font-size="25" fill="#17324d">빈값과 숫자 비교</text><text x="50" y="147" font-size="21" fill="#17324d">numCompare(null, 0.10, false) → 0.10</text><text x="535" y="191" font-size="24" fill="#007f86">↓</text><rect x="30" y="193" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="227" font-size="25" fill="#17324d">0과 숫자 비교</text><text x="50" y="260" font-size="21" fill="#17324d">numCompare(0, 0.10, false) → 0.10 (최솟값 0이 아님)</text><text x="535" y="304" font-size="24" fill="#007f86">↓</text><rect x="30" y="306" width="1040" height="88" rx="10" fill="#eef7f8" stroke="#b7c8d5"/><text x="50" y="340" font-size="25" fill="#17324d">둘 다 0 또는 한쪽만 0</text><text x="50" y="373" font-size="21" fill="#17324d">0과 0은 0 / null과 0은 0 → 모든 0을 null로 바꾸는 함수도 아님</text><text x="30" y="471" font-size="19" fill="#516579">설명용 도식 · 숫자는 운영 기준값이 아닙니다.</text></g></svg>