<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 602" role="img"><title>품명 E·C·D의 폭공차에는 별도 비교가 있습니다</title><desc>하한: numCompare(고객 하한, 규격 하한, true): 큰 유효값, 0 제외 / 상한: 양쪽 모두 값 있음: Math.min(고객 상한, 규격 상한): 작은 값, 여기서는 0도 포함 / 상한: 한쪽이 빈값: numCompare(..., true)로 남아 있는 값 적용 / 예제: 고객 [0, 0] / 규격 [−2, +3] → 보증 [−2, 0]</desc><rect width="1100" height="602" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="46" font-size="30" fill="#17324d">품명 E·C·D의 폭공차에는 별도 비교가 있습니다</text><rect x="30" y="80" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="114" font-size="25" fill="#17324d">하한</text><text x="50" y="147" font-size="21" fill="#17324d">numCompare(고객 하한, 규격 하한, true): 큰 유효값, 0 제외</text><text x="535" y="191" font-size="24" fill="#007f86">↓</text><rect x="30" y="193" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="227" font-size="25" fill="#17324d">상한: 양쪽 모두 값 있음</text><text x="50" y="260" font-size="21" fill="#17324d">Math.min(고객 상한, 규격 상한): 작은 값, 여기서는 0도 포함</text><text x="535" y="304" font-size="24" fill="#007f86">↓</text><rect x="30" y="306" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="340" font-size="25" fill="#17324d">상한: 한쪽이 빈값</text><text x="50" y="373" font-size="21" fill="#17324d">numCompare(..., true)로 남아 있는 값 적용</text><text x="535" y="417" font-size="24" fill="#007f86">↓</text><rect x="30" y="419" width="1040" height="88" rx="10" fill="#eef7f8" stroke="#b7c8d5"/><text x="50" y="453" font-size="25" fill="#17324d">예제</text><text x="50" y="486" font-size="21" fill="#17324d">고객 [0, 0] / 규격 [−2, +3] → 보증 [−2, 0]</text><text x="30" y="584" font-size="19" fill="#516579">설명용 도식 · 숫자는 운영 기준값이 아닙니다.</text></g></svg>