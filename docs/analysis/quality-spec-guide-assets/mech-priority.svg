<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 602" role="img"><title>숫자 범위와 시험 지시는 선택 규칙이 다릅니다</title><desc>숫자 범위: TS 등 하한: 큰 유효값 / 상한: 작은 유효값 / 시험 지시: 고객값 A 있음: 고객 A · 규격 B · 사내 C → A 유지 / 시험 지시: 고객값 없음: 고객 빈값 · 규격 B · 사내 C → B / 시험 지시: 고객·규격 모두 없음: 고객 빈값 · 규격 빈값 · 사내 C → C</desc><rect width="1100" height="602" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="46" font-size="30" fill="#17324d">숫자 범위와 시험 지시는 선택 규칙이 다릅니다</text><rect x="30" y="80" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="114" font-size="25" fill="#17324d">숫자 범위</text><text x="50" y="147" font-size="21" fill="#17324d">TS 등 하한: 큰 유효값 / 상한: 작은 유효값</text><text x="535" y="191" font-size="24" fill="#007f86">↓</text><rect x="30" y="193" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="227" font-size="25" fill="#17324d">시험 지시: 고객값 A 있음</text><text x="50" y="260" font-size="21" fill="#17324d">고객 A · 규격 B · 사내 C → A 유지</text><text x="535" y="304" font-size="24" fill="#007f86">↓</text><rect x="30" y="306" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="340" font-size="25" fill="#17324d">시험 지시: 고객값 없음</text><text x="50" y="373" font-size="21" fill="#17324d">고객 빈값 · 규격 B · 사내 C → B</text><text x="535" y="417" font-size="24" fill="#007f86">↓</text><rect x="30" y="419" width="1040" height="88" rx="10" fill="#eef7f8" stroke="#b7c8d5"/><text x="50" y="453" font-size="25" fill="#17324d">시험 지시: 고객·규격 모두 없음</text><text x="50" y="486" font-size="21" fill="#17324d">고객 빈값 · 규격 빈값 · 사내 C → C</text><text x="30" y="584" font-size="19" fill="#516579">설명용 도식 · 숫자는 운영 기준값이 아닙니다.</text></g></svg>