<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 602" role="img"><title>주문폭 1,000mm와 폭공차는 다른 값입니다</title><desc>주문 기준폭: 1,000mm: 제품의 기준 크기 / 보증 폭공차: 하한 −1mm / 상한 +2mm: 기준에서 허용하는 차이 / 제품폭 보증범위: 1,000 + (−1) = 999mm / 1,000 + 2 = 1,002mm / 그 다음 폭설계: 제품 목표폭·공정수축·마진을 별도로 반영하여 원자재폭 계산</desc><rect width="1100" height="602" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="46" font-size="30" fill="#17324d">주문폭 1,000mm와 폭공차는 다른 값입니다</text><rect x="30" y="80" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="114" font-size="25" fill="#17324d">주문 기준폭</text><text x="50" y="147" font-size="21" fill="#17324d">1,000mm: 제품의 기준 크기</text><text x="535" y="191" font-size="24" fill="#007f86">↓</text><rect x="30" y="193" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="227" font-size="25" fill="#17324d">보증 폭공차</text><text x="50" y="260" font-size="21" fill="#17324d">하한 −1mm / 상한 +2mm: 기준에서 허용하는 차이</text><text x="535" y="304" font-size="24" fill="#007f86">↓</text><rect x="30" y="306" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="340" font-size="25" fill="#17324d">제품폭 보증범위</text><text x="50" y="373" font-size="21" fill="#17324d">1,000 + (−1) = 999mm / 1,000 + 2 = 1,002mm</text><text x="535" y="417" font-size="24" fill="#007f86">↓</text><rect x="30" y="419" width="1040" height="88" rx="10" fill="#eef7f8" stroke="#b7c8d5"/><text x="50" y="453" font-size="25" fill="#17324d">그 다음 폭설계</text><text x="50" y="486" font-size="21" fill="#17324d">제품 목표폭·공정수축·마진을 별도로 반영하여 원자재폭 계산</text><text x="30" y="584" font-size="19" fill="#516579">설명용 도식 · 숫자는 운영 기준값이 아닙니다.</text></g></svg>