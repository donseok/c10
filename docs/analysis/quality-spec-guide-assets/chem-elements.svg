<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 602" role="img"><title>원소마다 독립적인 두 개의 경계를 만듭니다</title><desc>C: 탄소: C_LLV ← 가장 큰 유효 하한 / C_ULV ← 가장 작은 유효 상한 / Si: 규소 · Mn: 망간: 동일한 비교를 각 원소별로 반복 / 나머지 10개 원소: P·S·Cr·Ni·Cu·Al·Ti·Nb·V·N도 각각 비교 / 결과: 13개 원소 × 하한·상한 = 26개 성분값. 원소 간 합산·평균은 없음</desc><rect width="1100" height="602" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="46" font-size="30" fill="#17324d">원소마다 독립적인 두 개의 경계를 만듭니다</text><rect x="30" y="80" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="114" font-size="25" fill="#17324d">C: 탄소</text><text x="50" y="147" font-size="21" fill="#17324d">C_LLV ← 가장 큰 유효 하한 / C_ULV ← 가장 작은 유효 상한</text><text x="535" y="191" font-size="24" fill="#007f86">↓</text><rect x="30" y="193" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="227" font-size="25" fill="#17324d">Si: 규소 · Mn: 망간</text><text x="50" y="260" font-size="21" fill="#17324d">동일한 비교를 각 원소별로 반복</text><text x="535" y="304" font-size="24" fill="#007f86">↓</text><rect x="30" y="306" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="340" font-size="25" fill="#17324d">나머지 10개 원소</text><text x="50" y="373" font-size="21" fill="#17324d">P·S·Cr·Ni·Cu·Al·Ti·Nb·V·N도 각각 비교</text><text x="535" y="417" font-size="24" fill="#007f86">↓</text><rect x="30" y="419" width="1040" height="88" rx="10" fill="#eef7f8" stroke="#b7c8d5"/><text x="50" y="453" font-size="25" fill="#17324d">결과</text><text x="50" y="486" font-size="21" fill="#17324d">13개 원소 × 하한·상한 = 26개 성분값. 원소 간 합산·평균은 없음</text><text x="30" y="584" font-size="19" fill="#516579">설명용 도식 · 숫자는 운영 기준값이 아닙니다.</text></g></svg>