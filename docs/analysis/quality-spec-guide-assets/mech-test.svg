<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 602" role="img"><title>강재를 당겨 보는 시험에서 무엇을 요구하나요?</title><desc>TS · 인장강도: 잡아당기는 하중에 견디는 강도 수준 → 하한·상한 MPa / YP · 항복강도: 영구 변형이 시작되는 강도 수준 → 하한·상한 MPa / ELGN · 연신율: 늘어나는 정도의 요구 범위 → 하한·상한 / 시험 지시: 굽힘시험 기준·시편 위치·길이·호수도 함께 편성</desc><rect width="1100" height="602" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="46" font-size="30" fill="#17324d">강재를 당겨 보는 시험에서 무엇을 요구하나요?</text><rect x="30" y="80" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="114" font-size="25" fill="#17324d">TS · 인장강도</text><text x="50" y="147" font-size="21" fill="#17324d">잡아당기는 하중에 견디는 강도 수준 → 하한·상한 MPa</text><text x="535" y="191" font-size="24" fill="#007f86">↓</text><rect x="30" y="193" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="227" font-size="25" fill="#17324d">YP · 항복강도</text><text x="50" y="260" font-size="21" fill="#17324d">영구 변형이 시작되는 강도 수준 → 하한·상한 MPa</text><text x="535" y="304" font-size="24" fill="#007f86">↓</text><rect x="30" y="306" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="340" font-size="25" fill="#17324d">ELGN · 연신율</text><text x="50" y="373" font-size="21" fill="#17324d">늘어나는 정도의 요구 범위 → 하한·상한</text><text x="535" y="417" font-size="24" fill="#007f86">↓</text><rect x="30" y="419" width="1040" height="88" rx="10" fill="#eef7f8" stroke="#b7c8d5"/><text x="50" y="453" font-size="25" fill="#17324d">시험 지시</text><text x="50" y="486" font-size="21" fill="#17324d">굽힘시험 기준·시편 위치·길이·호수도 함께 편성</text><text x="30" y="584" font-size="19" fill="#516579">시험 개념도 · 실제 시험 절차와 단위는 해당 기준정보를 확인합니다.</text></g></svg>