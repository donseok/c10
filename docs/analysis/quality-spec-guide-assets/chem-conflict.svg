<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 602" role="img"><title>범위를 좁혔는데 겹치는 부분이 없으면?</title><desc>고객 요구: 탄소 하한 0.12 / 상한 0.18 / 규격 요구: 탄소 하한 0.02 / 상한 0.10 / 편성 결과: 하한 0.12 / 상한 0.10 → 하한이 상한보다 큼 / 해석: 가능한 함량이 없음. 편성 클래스는 값을 정렬하거나 자동 타협하지 않음</desc><rect width="1100" height="602" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="46" font-size="30" fill="#17324d">범위를 좁혔는데 겹치는 부분이 없으면?</text><rect x="30" y="80" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="114" font-size="25" fill="#17324d">고객 요구</text><text x="50" y="147" font-size="21" fill="#17324d">탄소 하한 0.12 / 상한 0.18</text><text x="535" y="191" font-size="24" fill="#007f86">↓</text><rect x="30" y="193" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="227" font-size="25" fill="#17324d">규격 요구</text><text x="50" y="260" font-size="21" fill="#17324d">탄소 하한 0.02 / 상한 0.10</text><text x="535" y="304" font-size="24" fill="#007f86">↓</text><rect x="30" y="306" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="340" font-size="25" fill="#17324d">편성 결과</text><text x="50" y="373" font-size="21" fill="#17324d">하한 0.12 / 상한 0.10 → 하한이 상한보다 큼</text><text x="535" y="417" font-size="24" fill="#007f86">↓</text><rect x="30" y="419" width="1040" height="88" rx="10" fill="#eef7f8" stroke="#b7c8d5"/><text x="50" y="453" font-size="25" fill="#17324d">해석</text><text x="50" y="486" font-size="21" fill="#17324d">가능한 함량이 없음. 편성 클래스는 값을 정렬하거나 자동 타협하지 않음</text><text x="30" y="584" font-size="19" fill="#516579">설명용 도식 · 숫자는 운영 기준값이 아닙니다.</text></g></svg>