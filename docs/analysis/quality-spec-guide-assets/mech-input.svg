<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 602" role="img"><title>재질코드를 입력으로 삼아 요구 성능을 찾습니다</title><desc>규격 사양 2: 규격약호 + 연도 + 환산두께 → C10B1012 / 고객 사양 1: 고객사양번호 → VI_M00_C10A1022 / 사내 사양 3: 품명 + 재질코드 MQL_CD + 환산두께 → C10B1032 / 보증 사양 4: 숫자 범위 8쌍과 시험 지시 4개를 항목별 편성</desc><rect width="1100" height="602" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="46" font-size="30" fill="#17324d">재질코드를 입력으로 삼아 요구 성능을 찾습니다</text><rect x="30" y="80" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="114" font-size="25" fill="#17324d">규격 사양 2</text><text x="50" y="147" font-size="21" fill="#17324d">규격약호 + 연도 + 환산두께 → C10B1012</text><text x="535" y="191" font-size="24" fill="#007f86">↓</text><rect x="30" y="193" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="227" font-size="25" fill="#17324d">고객 사양 1</text><text x="50" y="260" font-size="21" fill="#17324d">고객사양번호 → VI_M00_C10A1022</text><text x="535" y="304" font-size="24" fill="#007f86">↓</text><rect x="30" y="306" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="340" font-size="25" fill="#17324d">사내 사양 3</text><text x="50" y="373" font-size="21" fill="#17324d">품명 + 재질코드 MQL_CD + 환산두께 → C10B1032</text><text x="535" y="417" font-size="24" fill="#007f86">↓</text><rect x="30" y="419" width="1040" height="88" rx="10" fill="#eef7f8" stroke="#b7c8d5"/><text x="50" y="453" font-size="25" fill="#17324d">보증 사양 4</text><text x="50" y="486" font-size="21" fill="#17324d">숫자 범위 8쌍과 시험 지시 4개를 항목별 편성</text><text x="30" y="584" font-size="19" fill="#516579">설명용 도식 · 숫자는 운영 기준값이 아닙니다.</text></g></svg>