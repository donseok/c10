<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 602" role="img"><title>보증 초깃값과 최종 저장값이 달라질 수 있습니다</title><desc>① 보증 편성 직후: TS 고객 280~400 / 규격 270~410 / 사내 300~390 → 300~390 / ② 후속 상태 처리의 해당 분기: 고객사양번호가 있으면 C102100MQL.cs_update 호출 / ③ 고객 TS 값 재적용: 고객행의 non-null TS 280~400 → 보증행 TS를 280~400으로 수정 / ④ 최종 확인: TS·YP·ELGN·HRB·ER 10개 값에 적용. 시험도금량·지시는 이 SQL 대상 아님</desc><rect width="1100" height="602" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="46" font-size="30" fill="#17324d">보증 초깃값과 최종 저장값이 달라질 수 있습니다</text><rect x="30" y="80" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="114" font-size="25" fill="#17324d">① 보증 편성 직후</text><text x="50" y="147" font-size="21" fill="#17324d">TS 고객 280~400 / 규격 270~410 / 사내 300~390 → 300~390</text><text x="535" y="191" font-size="24" fill="#007f86">↓</text><rect x="30" y="193" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="227" font-size="25" fill="#17324d">② 후속 상태 처리의 해당 분기</text><text x="50" y="260" font-size="21" fill="#17324d">고객사양번호가 있으면 C102100MQL.cs_update 호출</text><text x="535" y="304" font-size="24" fill="#007f86">↓</text><rect x="30" y="306" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="340" font-size="25" fill="#17324d">③ 고객 TS 값 재적용</text><text x="50" y="373" font-size="21" fill="#17324d">고객행의 non-null TS 280~400 → 보증행 TS를 280~400으로 수정</text><text x="535" y="417" font-size="24" fill="#007f86">↓</text><rect x="30" y="419" width="1040" height="88" rx="10" fill="#eef7f8" stroke="#b7c8d5"/><text x="50" y="453" font-size="25" fill="#17324d">④ 최종 확인</text><text x="50" y="486" font-size="21" fill="#17324d">TS·YP·ELGN·HRB·ER 10개 값에 적용. 시험도금량·지시는 이 SQL 대상 아님</text><text x="30" y="584" font-size="19" fill="#516579">설명용 도식 · 숫자는 운영 기준값이 아닙니다.</text></g></svg>