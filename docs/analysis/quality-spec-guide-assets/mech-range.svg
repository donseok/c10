<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 536" role="img"><title>인장강도 TS: 세 범위로 보증 초깃값을 만듭니다</title><rect width="1100" height="536" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="45" font-size="30" fill="#17324d">인장강도 TS: 세 범위로 보증 초깃값을 만듭니다</text><text x="30" y="80" font-size="21" fill="#17324d">가로 막대는 허용되는 범위입니다. 마지막 행에서 함께 허용되는 구간을 읽습니다.</text><text x="30" y="150" font-size="24" fill="#17324d">규격</text><line x1="280" y1="140" x2="990" y2="140" stroke="#d6e0e8"/><rect x="358.8888888888889" y="120" width="552.2222222222222" height="36" rx="10" fill="#d8e6ee" stroke="#b7c8d5"/><text x="280" y="185" font-size="21" fill="#17324d">270 ~ 410 MPa</text><text x="30" y="244" font-size="24" fill="#17324d">고객</text><line x1="280" y1="234" x2="990" y2="234" stroke="#d6e0e8"/><rect x="398.3333333333333" y="214" width="473.3333333333334" height="36" rx="10" fill="#d8e6ee" stroke="#b7c8d5"/><text x="280" y="279" font-size="21" fill="#17324d">280 ~ 400 MPa</text><text x="30" y="338" font-size="24" fill="#17324d">사내</text><line x1="280" y1="328" x2="990" y2="328" stroke="#d6e0e8"/><rect x="477.22222222222223" y="308" width="355.00000000000006" height="36" rx="10" fill="#d8e6ee" stroke="#b7c8d5"/><text x="280" y="373" font-size="21" fill="#17324d">300 ~ 390 MPa</text><text x="30" y="432" font-size="24" fill="#17324d">보증 초깃값</text><line x1="280" y1="422" x2="990" y2="422" stroke="#d6e0e8"/><rect x="477.22222222222223" y="402" width="355.00000000000006" height="36" rx="10" fill="#a4dbd4" stroke="#b7c8d5"/><text x="280" y="467" font-size="21" fill="#17324d">300 ~ 390 MPa</text><text x="30" y="524" font-size="20" fill="#17324d">가상 예제 · 0 또는 빈값이 있는 경우에는 별도 처리 규칙을 확인하세요.</text></g></svg>