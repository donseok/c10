<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 602" role="img"><title>형상값은 치수공차와 별도로 항목마다 선택합니다</title><desc>파형·굽음 관련: 반곡 H · 중곡 H · 외곡 H → 고객값이 있으면 유지 / 직선·각도 관련: 직선도 상한 · 직각도 상한 · 대각선차 상한 → 고객값이 있으면 유지 / 기타 형상: 급준도 · Telescope → 고객값이 있으면 유지 / 고객값이 빈 항목: 해당 항목만 규격값으로 보충. 더 작은 값 비교가 아님</desc><rect width="1100" height="602" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="30" y="46" font-size="30" fill="#17324d">형상값은 치수공차와 별도로 항목마다 선택합니다</text><rect x="30" y="80" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="114" font-size="25" fill="#17324d">파형·굽음 관련</text><text x="50" y="147" font-size="21" fill="#17324d">반곡 H · 중곡 H · 외곡 H → 고객값이 있으면 유지</text><text x="535" y="191" font-size="24" fill="#007f86">↓</text><rect x="30" y="193" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="227" font-size="25" fill="#17324d">직선·각도 관련</text><text x="50" y="260" font-size="21" fill="#17324d">직선도 상한 · 직각도 상한 · 대각선차 상한 → 고객값이 있으면 유지</text><text x="535" y="304" font-size="24" fill="#007f86">↓</text><rect x="30" y="306" width="1040" height="88" rx="10" fill="#f2f5f8" stroke="#b7c8d5"/><text x="50" y="340" font-size="25" fill="#17324d">기타 형상</text><text x="50" y="373" font-size="21" fill="#17324d">급준도 · Telescope → 고객값이 있으면 유지</text><text x="535" y="417" font-size="24" fill="#007f86">↓</text><rect x="30" y="419" width="1040" height="88" rx="10" fill="#eef7f8" stroke="#b7c8d5"/><text x="50" y="453" font-size="25" fill="#17324d">고객값이 빈 항목</text><text x="50" y="486" font-size="21" fill="#17324d">해당 항목만 규격값으로 보충. 더 작은 값 비교가 아님</text><text x="30" y="584" font-size="19" fill="#516579">명칭은 C102100DLV SQL 주석 기준. 측정 방향·길이·단위는 MD 정의를 확인합니다.</text></g></svg>