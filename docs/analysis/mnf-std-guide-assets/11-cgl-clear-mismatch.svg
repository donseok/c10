<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">CGL 값 삭제 시 열 불일치</title><desc id="desc">2CGL HT CT Line Speed와 3CGL 5CGL Line Speed를 지우면 다른 숨김열이 비워진다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="650" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="28" fill="#17324d" font-weight="700">TAB05에서 CGL 값을 지우면 마스터의 다른 숨김열이 비워지는 경우가 있습니다</text>
<text x="35" y="84" font-size="20" fill="#516579" font-weight="400">값을 입력할 때의 열 번호와 빈값으로 지울 때의 열 번호가 다른 조합 · JSP 987~1001행, 1097~1111행 기준</text>
<rect x="35" y="115" width="1030" height="46" fill="#e3eef2"/><text x="45" y="145" font-size="18" fill="#17324d" font-weight="700">지운 셀 (그리드 · 행 · 열)</text><text x="345" y="145" font-size="18" fill="#17324d" font-weight="700">의도한 숨김열</text><text x="595" y="145" font-size="18" fill="#17324d" font-weight="700">실제로 비워지는 숨김열</text><text x="875" y="145" font-size="18" fill="#17324d" font-weight="700">결과</text><rect x="35" y="161" width="1030" height="44" fill="#fff" stroke="#b7c8d5"/><text x="45" y="190" font-size="18" fill="#17324d" font-weight="400">Grid_3 · 2 CGL · HT</text><text x="345" y="190" font-size="18" fill="#17324d" font-weight="400">HTG_TEM_2CGL</text><text x="595" y="190" font-size="18" fill="#b3261e" font-weight="700">SHK_TM_2CGL</text><text x="875" y="190" font-size="18" fill="#b3261e" font-weight="700">불일치</text><rect x="35" y="205" width="1030" height="44" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="234" font-size="18" fill="#17324d" font-weight="400">Grid_3 · 2 CGL · CT</text><text x="345" y="234" font-size="18" fill="#17324d" font-weight="400">CLG_TEM_2CGL</text><text x="595" y="234" font-size="18" fill="#b3261e" font-weight="700">LN_SPD_2CGL</text><text x="875" y="234" font-size="18" fill="#b3261e" font-weight="700">불일치</text><rect x="35" y="249" width="1030" height="44" fill="#fff" stroke="#b7c8d5"/><text x="45" y="278" font-size="18" fill="#17324d" font-weight="400">Grid_3 · 2 CGL · Line Speed</text><text x="345" y="278" font-size="18" fill="#17324d" font-weight="400">LN_SPD_2CGL</text><text x="595" y="278" font-size="18" fill="#b3261e" font-weight="700">HEAT_CYL_NO_3CGL</text><text x="875" y="278" font-size="18" fill="#b3261e" font-weight="700">불일치</text><rect x="35" y="293" width="1030" height="44" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="322" font-size="18" fill="#17324d" font-weight="400">Grid_3 · 4 CGL · HT / CT / Line Speed</text><text x="345" y="322" font-size="18" fill="#17324d" font-weight="400">HTG·CLG·LN_SPD_4CGL</text><text x="595" y="322" font-size="18" fill="#17324d" font-weight="400">같은 열</text><text x="875" y="322" font-size="18" fill="#17324d" font-weight="400">정상</text><rect x="35" y="337" width="1030" height="44" fill="#fff" stroke="#b7c8d5"/><text x="45" y="366" font-size="18" fill="#17324d" font-weight="400">Grid_4 · 3 CGL · HT / CT</text><text x="345" y="366" font-size="18" fill="#17324d" font-weight="400">HTG·CLG_TEM_3CGL</text><text x="595" y="366" font-size="18" fill="#17324d" font-weight="400">같은 열</text><text x="875" y="366" font-size="18" fill="#17324d" font-weight="400">정상</text><rect x="35" y="381" width="1030" height="44" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="410" font-size="18" fill="#17324d" font-weight="400">Grid_4 · 3 CGL · Line Speed</text><text x="345" y="410" font-size="18" fill="#17324d" font-weight="400">LN_SPD_3CGL</text><text x="595" y="410" font-size="18" fill="#b3261e" font-weight="700">SHK_TM_3CGL</text><text x="875" y="410" font-size="18" fill="#b3261e" font-weight="700">불일치</text><rect x="35" y="425" width="1030" height="44" fill="#fff" stroke="#b7c8d5"/><text x="45" y="454" font-size="18" fill="#17324d" font-weight="400">Grid_4 · 5 CGL · HT / CT</text><text x="345" y="454" font-size="18" fill="#17324d" font-weight="400">HTG·CLG_TEM_5CGL</text><text x="595" y="454" font-size="18" fill="#17324d" font-weight="400">같은 열</text><text x="875" y="454" font-size="18" fill="#17324d" font-weight="400">정상</text><rect x="35" y="469" width="1030" height="44" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="498" font-size="18" fill="#17324d" font-weight="400">Grid_4 · 5 CGL · Line Speed</text><text x="345" y="498" font-size="18" fill="#17324d" font-weight="400">LN_SPD_5CGL</text><text x="595" y="498" font-size="18" fill="#b3261e" font-weight="700">SHK_TM_5CGL</text><text x="875" y="498" font-size="18" fill="#b3261e" font-weight="700">불일치</text><rect x="35" y="513" width="1030" height="44" fill="#fff" stroke="#b7c8d5"/><text x="45" y="542" font-size="18" fill="#17324d" font-weight="400">ST (ShockingTime) 전 라인</text><text x="345" y="542" font-size="18" fill="#17324d" font-weight="400">SHK_TM_xCGL</text><text x="595" y="542" font-size="18" fill="#17324d" font-weight="400">같은 열</text><text x="875" y="542" font-size="18" fill="#17324d" font-weight="400">정상</text>
<text x="35" y="590" font-size="19" fill="#17324d" font-weight="700">값을 새로 입력할 때(빈값이 아닐 때)는 모든 열이 정확히 맞습니다. 지운 뒤 저장하면 지운 값은 남고 이웃 값이 사라질 수 있습니다.</text>
<text x="35" y="622" font-size="18" fill="#516579" font-weight="400">소스에서 확인한 열 번호 불일치이며, 운영 화면에서 재현했다는 뜻은 아닙니다. TAB06 의 동기화 열 번호는 모두 맞습니다.</text></g></svg>
