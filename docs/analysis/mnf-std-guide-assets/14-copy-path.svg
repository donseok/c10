<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">적정과 차선의 계산·복사</title><desc id="desc">제조사양과 도금량은 행별로, 수지 조도와 TM Pass는 주문 단위로, 두께 소둔과 공정별 Size는 구매반제품 차선에서 적정을 복사한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="580" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="29" fill="#17324d" font-weight="700">적정·차선 행마다 계산하는 단계와 적정 값을 복사하는 단계가 다릅니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">구매반제품 차선 = 제조구분 ≠ 1 이고 원자재 첫 글자가 H/M 이 아니며 품명이 5·7 이 아닌 행</text>
<rect x="35" y="115" width="1030" height="46" fill="#e3eef2"/><text x="45" y="145" font-size="18" fill="#17324d" font-weight="700">단계</text><text x="265" y="145" font-size="18" fill="#17324d" font-weight="700">적정 1 행</text><text x="550" y="145" font-size="18" fill="#17324d" font-weight="700">구매반제품 차선 행</text><text x="845" y="145" font-size="18" fill="#17324d" font-weight="700">저장 SQL</text><rect x="35" y="161" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="190" font-size="18" fill="#17324d" font-weight="400">① 제조사양</text><text x="265" y="190" font-size="18" fill="#17324d" font-weight="400">후보 원자재별 INSERT</text><text x="550" y="190" font-size="18" fill="#17324d" font-weight="400">같은 규칙으로 별도 INSERT</text><text x="845" y="190" font-size="18" fill="#17324d" font-weight="400">C102100MNF.insert</text><rect x="35" y="207" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="236" font-size="18" fill="#17324d" font-weight="400">② 도금량</text><text x="265" y="236" font-size="18" fill="#17324d" font-weight="400">품명·도금량코드로 조회</text><text x="550" y="236" font-size="18" fill="#17324d" font-weight="400">같은 조회 → 같은 값</text><text x="845" y="236" font-size="18" fill="#17324d" font-weight="400">gw_update (제조구분별)</text><rect x="35" y="253" width="1030" height="46" fill="#fff4e7" stroke="#b7c8d5"/><text x="45" y="282" font-size="18" fill="#17324d" font-weight="400">③ 수지·조도</text><text x="265" y="282" font-size="18" fill="#17324d" font-weight="400">주문 단위 1회 계산</text><text x="550" y="282" font-size="18" fill="#17324d" font-weight="400">적정과 같은 값으로 갱신</text><text x="845" y="282" font-size="18" fill="#17324d" font-weight="400">RR_update (제조구분 없음)</text><rect x="35" y="299" width="1030" height="46" fill="#fff4e7" stroke="#b7c8d5"/><text x="45" y="328" font-size="18" fill="#17324d" font-weight="400">④ TM Pass수</text><text x="265" y="328" font-size="18" fill="#17324d" font-weight="400">주문 단위 1회</text><text x="550" y="328" font-size="18" fill="#17324d" font-weight="400">적정과 같은 값으로 갱신</text><text x="845" y="328" font-size="18" fill="#17324d" font-weight="400">C102100PROC.MNFupdate</text><rect x="35" y="345" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="374" font-size="18" fill="#17324d" font-weight="400">⑤ 두께·소둔</text><text x="265" y="374" font-size="18" fill="#17324d" font-weight="400">계산 + C10B1051 조회</text><text x="550" y="374" font-size="18" fill="#17324d" font-weight="400">SEM_RMTL_YN=Y → 적정 복사</text><text x="845" y="374" font-size="18" fill="#17324d" font-weight="400">THK_MNFupdate(1)</text><rect x="35" y="391" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="420" font-size="18" fill="#17324d" font-weight="400">⑥ 공정별 Size</text><text x="265" y="420" font-size="18" fill="#17324d" font-weight="400">계산 + 기준 조회</text><text x="550" y="420" font-size="18" fill="#17324d" font-weight="400">SEM_RMTL_YN=Y → 적정 복사</text><text x="845" y="420" font-size="18" fill="#17324d" font-weight="400">PROCupdate(1)</text><rect x="35" y="437" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="466" font-size="18" fill="#17324d" font-weight="400">원자재 Size (참고)</text><text x="265" y="466" font-size="18" fill="#17324d" font-weight="400">원자재별 계산</text><text x="550" y="466" font-size="18" fill="#17324d" font-weight="400">차선 행에서도 별도 계산</text><text x="845" y="466" font-size="18" fill="#17324d" font-weight="400">C102100RMTL.update</text>
<text x="35" y="510" font-size="20" fill="#17324d" font-weight="700">열연 H/M 차선은 적정과 같은 계산을 자기 원자재코드로 다시 합니다. 복사 경로는 구매반제품 차선에만 있습니다.</text>
<text x="35" y="545" font-size="19" fill="#516579" font-weight="400">주황 행은 적정·차선 구분 없이 모든 행이 같은 값을 받습니다. 차선만 다른 조도·수지 값을 가질 수 없습니다.</text></g></svg>
