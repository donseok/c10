<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc"><title id="title">EGI 제조표준 카드</title><desc id="desc">설명용 EGI 주문의 ECL, 도금량, 조도, TM Pass, ANN 소둔, EGL 목표 Size, PLTCM 값과 출처.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="690" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="29" fill="#17324d" font-weight="700">설명용 EGI 주문 한 건의 전기도금 제조표준: 값은 모두 가정입니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">EGI · 주문두께 0.800 BMT · 도금량코드 E3 · 주문조도코드 R1 · 통과 EGL(91) · 일반ANN(43) · TM(51)</text>
<rect x="35" y="110" width="1030" height="46" fill="#e3eef2"/><text x="45" y="140" font-size="19" fill="#17324d" font-weight="700">항목</text><text x="295" y="140" font-size="19" fill="#17324d" font-weight="700">설명용 값</text><text x="625" y="140" font-size="19" fill="#17324d" font-weight="700">어디서 오나</text><rect x="35" y="156" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="185" font-size="19" fill="#17324d" font-weight="400">ECL C-D 방지약품</text><text x="295" y="185" font-size="19" fill="#17324d" font-weight="400">1</text><text x="625" y="185" font-size="19" fill="#17324d" font-weight="400">C10B2130 · 주문두께</text><rect x="35" y="202" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="231" font-size="19" fill="#17324d" font-weight="400">ECL 권취장력</text><text x="295" y="231" font-size="19" fill="#17324d" font-weight="400">2</text><text x="625" y="231" font-size="19" fill="#17324d" font-weight="400">C10B2140 · 품명</text><rect x="35" y="248" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="277" font-size="19" fill="#17324d" font-weight="400">EGL 표면처리코드</text><text x="295" y="277" font-size="19" fill="#17324d" font-weight="400">주문표면처리 그대로</text><text x="625" y="277" font-size="19" fill="#17324d" font-weight="400">E·N만 복사 (2·8 칼라는 비움)</text><rect x="35" y="294" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="323" font-size="19" fill="#17324d" font-weight="400">작업도금량 전면·후면</text><text x="295" y="323" font-size="19" fill="#17324d" font-weight="400">전면 20~30 · 후면 20~30 · 목표 25</text><text x="625" y="323" font-size="19" fill="#17324d" font-weight="400">C10A1061 · 품명 + 도금량코드</text><rect x="35" y="340" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="369" font-size="19" fill="#17324d" font-weight="400">도금두께</text><text x="295" y="369" font-size="19" fill="#17324d" font-weight="400">목표 3 μm</text><text x="625" y="369" font-size="19" fill="#17324d" font-weight="400">C10A1061 같은 행</text><rect x="35" y="386" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="415" font-size="19" fill="#17324d" font-weight="400">조도 Ra</text><text x="295" y="415" font-size="19" fill="#17324d" font-weight="400">0.8 ~ 1.2 (PPI·Rmax는 미설계)</text><text x="625" y="415" font-size="19" fill="#17324d" font-weight="400">C10B2210 · 품명 + 주문조도코드</text><rect x="35" y="432" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="461" font-size="19" fill="#17324d" font-weight="400">TM Pass수</text><text x="295" y="461" font-size="19" fill="#17324d" font-weight="400">1</text><text x="625" y="461" font-size="19" fill="#17324d" font-weight="400">C10B2240 조회 후 TM 공정이 있으면 1로 고정</text><rect x="35" y="478" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="507" font-size="19" fill="#17324d" font-weight="400">일반ANN / H-C ANN</text><text x="295" y="507" font-size="19" fill="#17324d" font-weight="400">Cycle B2 · 보정 5 · 코일 650 · 냉각 120</text><text x="625" y="507" font-size="19" fill="#17324d" font-weight="400">C10B1051 · 제조표준번호·품명·재질·SET·폭</text><rect x="35" y="524" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="553" font-size="19" fill="#17324d" font-weight="400">EGL·TM 목표 Size</text><text x="295" y="553" font-size="19" fill="#17324d" font-weight="400">EGL 두께 0.811 · 폭 1,006 · TM 두께 0.808</text><text x="625" y="553" font-size="19" fill="#17324d" font-weight="400">두께=정전목표두께 · TM=EGL−도금두께</text><rect x="35" y="570" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="599" font-size="19" fill="#17324d" font-weight="400">PLTCM</text><text x="295" y="599" font-size="19" fill="#17324d" font-weight="400">SET 0.810 · WR Type B · 내경링 N · S/T Y</text><text x="625" y="599" font-size="19" fill="#17324d" font-weight="400">C10B2110·2120 · Edge S/M → Y</text>
<text x="35" y="650" font-size="20" fill="#17324d" font-weight="700">같은 행에 CGL 소둔 컬럼도 있지만 EGI에서는 비어 있습니다. 화면도 그 컬럼을 숨깁니다.</text></g></svg>
