<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880" role="img" aria-labelledby="title desc"><title id="title">자동설계 6단계</title><desc id="desc">제조사양, 도금량, 수지 조도, 통과공정, 두께 소둔, 공정별 Size 순서로 제조표준 컬럼을 채운다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="880" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="29" fill="#17324d" font-weight="700">자동설계 6단계가 제조표준 행의 서로 다른 컬럼을 채웁니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">C102100000 메인 서비스의 실행 순서 · 앞 단계 값을 뒤 단계가 다시 읽습니다</text>
<rect x="35" y="115" width="1030" height="98" rx="12" fill="#eef7f8" stroke="#b7c8d5"/>
<text x="55" y="151" font-size="23" fill="#17324d" font-weight="700">① 제조사양</text>
<text x="55" y="181" font-size="17" fill="#516579" font-weight="400">C103100020 · DbSearchMnfData</text>
<text x="330" y="151" font-size="19" fill="#17324d" font-weight="400">원자재·제조표준번호, ECL 약품·장력, CGL Leveler·Spangle·S</text>
<text x="330" y="179" font-size="19" fill="#17324d" font-weight="400">kinPass·표면처리, 도유코드</text>
<text x="330" y="205" font-size="17" fill="#007f86" font-weight="700">기준: C10B2130·2140·2150·2170</text>
<path d="M150 215V227" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="227" width="1030" height="98" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="55" y="263" font-size="23" fill="#17324d" font-weight="700">② 도금량</text>
<text x="55" y="293" font-size="17" fill="#516579" font-weight="400">C103100040 · DbSearchGwTotData</text>
<text x="330" y="263" font-size="19" fill="#17324d" font-weight="400">작업도금량 목표·전면·후면·전체 상하한, 도금두께 하한·상한·목표, 사양도금두께</text>
<text x="330" y="317" font-size="17" fill="#007f86" font-weight="700">기준: C10A1061 View</text>
<path d="M150 327V339" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="339" width="1030" height="98" rx="12" fill="#eef7f8" stroke="#b7c8d5"/>
<text x="55" y="375" font-size="23" fill="#17324d" font-weight="700">③ 수지·조도</text>
<text x="55" y="405" font-size="17" fill="#516579" font-weight="400">C103100050 · DbSearchRsnRouData</text>
<text x="330" y="375" font-size="19" fill="#17324d" font-weight="400">수지부착량 목표·상하한(용융) 또는 조도 Ra 상하한(TM 통과)</text>
<text x="330" y="429" font-size="17" fill="#007f86" font-weight="700">기준: C10B2160 · C10B2210</text>
<path d="M150 439V451" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="451" width="1030" height="98" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="55" y="487" font-size="23" fill="#17324d" font-weight="700">④ 통과공정</text>
<text x="55" y="517" font-size="17" fill="#516579" font-weight="400">C103100030 · DbSearchProcData</text>
<text x="330" y="487" font-size="19" fill="#17324d" font-weight="400">TM Pass수 (통과공정 편성의 부산물)</text>
<text x="330" y="541" font-size="17" fill="#007f86" font-weight="700">기준: C10B2240</text>
<path d="M150 551V563" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="563" width="1030" height="98" rx="12" fill="#eef7f8" stroke="#b7c8d5"/>
<text x="55" y="599" font-size="23" fill="#17324d" font-weight="700">⑤ 두께·소둔</text>
<text x="55" y="629" font-size="17" fill="#516579" font-weight="400">C103100070 · DbSearchThkSizeData</text>
<text x="330" y="599" font-size="19" fill="#17324d" font-weight="400">압연·PLTCM·X-Ray SET 두께, 제품두께범위, ANN 2종 또는 2~5</text>
<text x="330" y="627" font-size="19" fill="#17324d" font-weight="400"> CGL 소둔조건, 매중량</text>
<text x="330" y="653" font-size="17" fill="#007f86" font-weight="700">기준: C10B2060·2070·1051</text>
<path d="M150 663V675" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="675" width="1030" height="98" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="55" y="711" font-size="23" fill="#17324d" font-weight="700">⑥ 공정별 Size</text>
<text x="55" y="741" font-size="17" fill="#516579" font-weight="400">C103100090 · DbSearchProcSizeData</text>
<text x="330" y="711" font-size="19" fill="#17324d" font-weight="400">CGL/EGL/TM 목표두께·폭, PLTCM 두께공차·폭, 5Stand WR, </text>
<text x="330" y="739" font-size="19" fill="#17324d" font-weight="400">내경링, S/T 유무</text>
<text x="330" y="765" font-size="17" fill="#007f86" font-weight="700">기준: C10B2190·2110·2120 + 폭기준</text>
<text x="35" y="812" font-size="20" fill="#17324d" font-weight="700">②~④ 사이의 ‘수지·조도’와 ‘TM Pass’는 주문 단위로 한 번 계산해 적정·차선 행을 모두 같은 값으로 갱신합니다.</text>
<text x="35" y="845" font-size="19" fill="#516579" font-weight="400">계산 전에 컬럼을 비우는 CLEAR 액티비티는 ①②③⑤ 네 단계에만 있습니다. 재설계는 메인 서비스가 행 자체를 지운 뒤 다시 만듭니다.</text></g></svg>
