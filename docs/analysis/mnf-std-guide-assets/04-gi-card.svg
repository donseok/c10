<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc"><title id="title">GI 제조표준 카드</title><desc id="desc">설명용 GI 주문의 CGL Leveler, Spangle, 도금량, 도금두께, 수지부착량, 소둔조건, 목표 Size, PLTCM 값과 출처.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="690" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="29" fill="#17324d" font-weight="700">설명용 GI 주문 한 건의 용융도금 제조표준: 값은 모두 가정입니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">GI · 주문두께 0.500 TCT · 도금량코드 Z1 · Spangle 4 · Edge S · 통과 2 CGL</text>
<rect x="35" y="110" width="1030" height="46" fill="#e3eef2"/><text x="45" y="140" font-size="19" fill="#17324d" font-weight="700">항목</text><text x="295" y="140" font-size="19" fill="#17324d" font-weight="700">설명용 값</text><text x="625" y="140" font-size="19" fill="#17324d" font-weight="700">어디서 오나</text><rect x="35" y="156" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="185" font-size="19" fill="#17324d" font-weight="400">CGL Leveler 사용여부</text><text x="295" y="185" font-size="19" fill="#17324d" font-weight="400">Y</text><text x="625" y="185" font-size="19" fill="#17324d" font-weight="400">C10B2150 · 품명</text><rect x="35" y="202" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="231" font-size="19" fill="#17324d" font-weight="400">Spangle / Skin Pass</text><text x="295" y="231" font-size="19" fill="#17324d" font-weight="400">4 / Y</text><text x="625" y="231" font-size="19" fill="#17324d" font-weight="400">주문 Spangle 복사 · 4·5·7이면 Y</text><rect x="35" y="248" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="277" font-size="19" fill="#17324d" font-weight="400">CGL 표면처리코드</text><text x="295" y="277" font-size="19" fill="#17324d" font-weight="400">주문표면처리 그대로</text><text x="625" y="277" font-size="19" fill="#17324d" font-weight="400">주문표면처리코드 복사</text><rect x="35" y="294" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="323" font-size="19" fill="#17324d" font-weight="400">작업도금량 전체</text><text x="295" y="323" font-size="19" fill="#17324d" font-weight="400">하한 120 · 상한 150 · 목표 137</text><text x="625" y="323" font-size="19" fill="#17324d" font-weight="400">C10A1061 · 품명 + 도금량코드</text><rect x="35" y="340" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="369" font-size="19" fill="#17324d" font-weight="400">도금두께</text><text x="295" y="369" font-size="19" fill="#17324d" font-weight="400">목표 20 μm · 하한 17 · 상한 23</text><text x="625" y="369" font-size="19" fill="#17324d" font-weight="400">C10A1061 같은 행</text><rect x="35" y="386" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="415" font-size="19" fill="#17324d" font-weight="400">수지부착량</text><text x="295" y="415" font-size="19" fill="#17324d" font-weight="400">목표 800 · 700~900</text><text x="625" y="415" font-size="19" fill="#17324d" font-weight="400">C10B2160 · 품명 + 표면처리</text><rect x="35" y="432" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="461" font-size="19" fill="#17324d" font-weight="400">소둔조건 2·3·4·5 CGL</text><text x="295" y="461" font-size="19" fill="#17324d" font-weight="400">Cycle A1 · HT 780 · CT 460 · ST 60 · Speed 120</text><text x="625" y="461" font-size="19" fill="#17324d" font-weight="400">C10B1051 · 제조표준번호·품명·재질·SET·폭</text><rect x="35" y="478" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="507" font-size="19" fill="#17324d" font-weight="400">CGL 목표 Size</text><text x="295" y="507" font-size="19" fill="#17324d" font-weight="400">두께 0.505 · 폭 1,006</text><text x="625" y="507" font-size="19" fill="#17324d" font-weight="400">두께=정전목표두께 · 폭=폭설계</text><rect x="35" y="524" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="553" font-size="19" fill="#17324d" font-weight="400">PLTCM</text><text x="295" y="553" font-size="19" fill="#17324d" font-weight="400">SET 0.490 · WR Type A · 내경링 N · S/T Y</text><text x="625" y="553" font-size="19" fill="#17324d" font-weight="400">C10B2110·2120 · Edge S/M → Y</text><rect x="35" y="570" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="599" font-size="19" fill="#17324d" font-weight="400">도유코드 · ECL 항목</text><text x="295" y="599" font-size="19" fill="#17324d" font-weight="400">없음</text><text x="625" y="599" font-size="19" fill="#17324d" font-weight="400">CR·EG 계열에만 편성</text>
<text x="35" y="650" font-size="20" fill="#17324d" font-weight="700">이 값들은 조회 결과이지 계산 결과가 아닙니다. 어떤 기준 행이 선택되었는지는 운영 MD를 봐야 합니다.</text></g></svg>
