<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">소둔조건 출처</title><desc id="desc">C10B1051 제조표준기준을 5개 입력으로 조회해 ANN 2종 또는 CGL 4라인 소둔조건을 복사한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="580" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="29" fill="#17324d" font-weight="700">소둔조건은 계산하지 않고 제조표준기준 C10B1051 한 행에서 복사합니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">조회 입력 5개로 정확히 1건을 찾아야 하며, 품명 그룹에 따라 ANN 2종 또는 CGL 4라인을 채웁니다</text>
<rect x="35" y="120" width="300" height="230" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="53" y="154" font-size="23" fill="#17324d" font-weight="700">조회 입력 5개</text><text x="53" y="186" font-size="18" fill="#17324d" font-weight="400">냉연제조표준번호 CRM_MNF_STD_NO</text><text x="53" y="214" font-size="18" fill="#17324d" font-weight="400">품명코드</text><text x="53" y="242" font-size="18" fill="#17324d" font-weight="400">재질코드</text><text x="53" y="270" font-size="18" fill="#17324d" font-weight="400">PLTCM X-Ray SET 두께</text><text x="53" y="298" font-size="18" fill="#17324d" font-weight="400">적용폭 (Slit이면 조합폭 합)</text>
<path d="M340 235H390" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="395" y="120" width="250" height="230" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="413" y="154" font-size="23" fill="#17324d" font-weight="700">기준 1건</text><text x="413" y="186" font-size="18" fill="#17324d" font-weight="400">0건 → KK13</text><text x="413" y="214" font-size="18" fill="#17324d" font-weight="400">2건 이상 → KK14</text><text x="413" y="242" font-size="18" fill="#17324d" font-weight="400">결과열 최대 30개</text><text x="413" y="270" font-size="18" fill="#17324d" font-weight="400">(관리화면 C107000030 tab18)</text>
<path d="M650 180H700" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M650 290H700" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="705" y="105" width="360" height="120" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="723" y="139" font-size="23" fill="#17324d" font-weight="700">CR·EG 계열 C·E·N·1·2·8</text><text x="723" y="171" font-size="17" fill="#17324d" font-weight="400">일반ANN: 로유형·Cycle·보정시간·코일온도·냉각종료</text><text x="723" y="199" font-size="17" fill="#17324d" font-weight="400">H-C ANN: 같은 5개</text>
<rect x="705" y="240" width="360" height="120" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="723" y="274" font-size="23" fill="#17324d" font-weight="700">용융 계열 G·K·J·L·V·W·3·4·6·9</text><text x="723" y="306" font-size="17" fill="#17324d" font-weight="400">2·3·4·5 CGL 각각: Cycle·가열·냉각·</text><text x="723" y="334" font-size="17" fill="#17324d" font-weight="400">ShockingTime·LineSpeed = 20개</text>
<rect x="35" y="385" width="1030" height="120" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="53" y="419" font-size="23" fill="#17324d" font-weight="700">통과공정과의 관계</text><text x="53" y="451" font-size="18" fill="#17324d" font-weight="400">4개 CGL 라인 값이 모두 저장되지만 실제로 쓰이는 라인은 통과공정(82~85)에 있는 라인입니다.</text><text x="53" y="479" font-size="18" fill="#17324d" font-weight="400">화면은 라인별로 나눠 보여주고, 정합성검사의 라인별 누락 검사는 현행 코드에서 실행되지 않습니다(9장).</text>
<text x="35" y="545" font-size="20" fill="#17324d" font-weight="700">5·7(CCAI·CCUS)은 이 조회를 건너뜁니다. 구매반제품 차선은 적정 행의 소둔조건을 그대로 복사합니다.</text></g></svg>
