<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc"><title id="title">제조표준 전체 구조</title><desc id="desc">주문과 설계 Key가 자동설계 6단계를 거쳐 제조표준 행 3개를 만들고, 용융도금 탭과 전기도금 탭이 같은 행을 보여준다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="690" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="29" fill="#17324d" font-weight="700">제조표준은 주문 한 건에서 적정·차선별로 만들어지는 공정 작업조건 묶음입니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">자동설계 6단계가 TB_C10_QLT_DSN_MNF 한 행을 차례로 채우고, 화면 두 탭이 같은 행을 보여줍니다</text>
<rect x="35" y="120" width="300" height="250" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="53" y="154" font-size="23" fill="#17324d" font-weight="700">주문·설계 Key</text><text x="53" y="186" font-size="20" fill="#17324d" font-weight="400">품명코드 · 재질코드</text><text x="53" y="214" font-size="20" fill="#17324d" font-weight="400">주문두께 · 주문폭</text><text x="53" y="242" font-size="20" fill="#17324d" font-weight="400">도금량지정코드</text><text x="53" y="270" font-size="20" fill="#17324d" font-weight="400">표면처리 · Spangle · 조도</text><text x="53" y="298" font-size="20" fill="#17324d" font-weight="400">냉연제조표준번호</text><text x="53" y="326" font-size="20" fill="#17324d" font-weight="400">원자재 후보 1~3</text>
<path d="M340 245H390" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="395" y="120" width="330" height="250" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="413" y="154" font-size="23" fill="#17324d" font-weight="700">자동설계 6단계</text><text x="413" y="186" font-size="20" fill="#17324d" font-weight="400">① 제조사양  ② 도금량</text><text x="413" y="214" font-size="20" fill="#17324d" font-weight="400">③ 수지·조도  ④ 통과공정·TM Pass</text><text x="413" y="242" font-size="20" fill="#17324d" font-weight="400">⑤ 두께·소둔  ⑥ 공정별 Size</text><text x="413" y="270" font-size="20" fill="#17324d" font-weight="400">각 단계가 자기 컬럼만 채웁니다</text><text x="413" y="298" font-size="20" fill="#17324d" font-weight="400">실패하면 오류코드를 남기고 멈춥니다</text>
<path d="M730 245H780" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="785" y="120" width="280" height="250" rx="12" fill="#fff4e7" stroke="#b7c8d5"/>
<text x="803" y="154" font-size="23" fill="#17324d" font-weight="700">TB_C10_QLT_DSN_MNF</text>
<rect x="803" y="175" width="244" height="48" rx="12" fill="#fff" stroke="#b7c8d5"/>
<text x="818" y="206" font-size="21" fill="#17324d" font-weight="700">적정</text>
<text x="895" y="206" font-size="18" fill="#516579" font-weight="400">QLT_DSN_MNF_TP = 1</text>
<rect x="803" y="235" width="244" height="48" rx="12" fill="#fff" stroke="#b7c8d5"/>
<text x="818" y="266" font-size="21" fill="#17324d" font-weight="700">차선1</text>
<text x="895" y="266" font-size="18" fill="#516579" font-weight="400">QLT_DSN_MNF_TP = 2</text>
<rect x="803" y="295" width="244" height="48" rx="12" fill="#fff" stroke="#b7c8d5"/>
<text x="818" y="326" font-size="21" fill="#17324d" font-weight="700">차선2</text>
<text x="895" y="326" font-size="18" fill="#516579" font-weight="400">QLT_DSN_MNF_TP = 3</text>
<path d="M925 375V420" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="430" width="505" height="170" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="53" y="464" font-size="23" fill="#17324d" font-weight="700">용융도금-제조표준 (TAB05)</text><text x="53" y="496" font-size="20" fill="#17324d" font-weight="400">품명 G·K·J·L·V·W·3·4·6·9 (5·7 조회만)</text><text x="53" y="524" font-size="20" fill="#17324d" font-weight="400">PLTCM · 2~5 CGL 소둔조건 · 도금부착량</text><text x="53" y="552" font-size="20" fill="#17324d" font-weight="400">수지부착량 · CGL 목표 Size · 품질메세지</text>
<rect x="560" y="430" width="505" height="170" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="578" y="464" font-size="23" fill="#17324d" font-weight="700">전기도금-제조표준 (TAB06)</text><text x="578" y="496" font-size="20" fill="#17324d" font-weight="400">품명 A·B·C·D·E·N·1·2·8 (4·9도 조회)</text><text x="578" y="524" font-size="20" fill="#17324d" font-weight="400">PLTCM · ECL · TM 조도·Pass · ANN 소둔</text><text x="578" y="552" font-size="20" fill="#17324d" font-weight="400">EGL 도금량 · EGL 목표 Size · 품질메세지</text>
<text x="35" y="650" font-size="21" fill="#17324d" font-weight="700">같은 128개 컬럼의 한 행을 두 탭이 서로 다른 부분집합으로 보여줍니다. 두 탭이 별도 테이블을 쓰는 것이 아닙니다.</text></g></svg>
