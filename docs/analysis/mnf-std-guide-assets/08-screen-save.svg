<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="645" viewBox="0 0 1100 645" role="img" aria-labelledby="title desc"><title id="title">화면 저장 경로</title><desc id="desc">하위 그리드 편집이 마스터 숨김열로 동기화되고, 검증 후 이력기록과 UPDATE, 수정로그, 재조회가 이어진다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="645" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="28" fill="#17324d" font-weight="700">화면 저장은 다시 설계하지 않습니다. 편집값을 그대로 UPDATE 하고 이력 두 곳에 남깁니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">TAB05·TAB06 공통 구조 · 마스터 그리드 한 번의 전송으로 하위 그리드 값까지 저장</text>
<rect x="35" y="120" width="240" height="200" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="53" y="154" font-size="23" fill="#17324d" font-weight="700">① 하위 그리드 편집</text><text x="53" y="186" font-size="18" fill="#17324d" font-weight="400">CGL 소둔 Grid_3·4</text><text x="53" y="214" font-size="18" fill="#17324d" font-weight="400">도금 Grid_5 (TAB05)</text><text x="53" y="242" font-size="18" fill="#17324d" font-weight="400">ECL·TM·ANN·EGL</text><text x="53" y="270" font-size="18" fill="#17324d" font-weight="400">Grid_4~7 (TAB06)</text>
<path d="M280 220H320" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="325" y="120" width="240" height="200" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="343" y="154" font-size="23" fill="#17324d" font-weight="700">② 마스터 숨김열 동기화</text><text x="343" y="186" font-size="17" fill="#17324d" font-weight="400">TAB05 Grid_2 / TAB06 Grid_3</text><text x="343" y="214" font-size="17" fill="#17324d" font-weight="400">편집 즉시 setCellByIndexValue</text><text x="343" y="242" font-size="17" fill="#17324d" font-weight="400">행 상태를 updated로 표시</text><text x="343" y="270" font-size="17" fill="#17324d" font-weight="400">(여기서 열 번호가 틀리면 다른 값이 바뀜)</text>
<path d="M570 220H610" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="615" y="120" width="450" height="200" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="633" y="154" font-size="23" fill="#17324d" font-weight="700">③ 저장 버튼 검증</text><text x="633" y="186" font-size="17" fill="#17324d" font-weight="400">변경 없음 → 중단 · 확정주문: TAB05 경고만, TAB06 중단</text><text x="633" y="214" font-size="17" fill="#17324d" font-weight="400">S/T Set값 &lt; 주문폭이면 중단 (Slit 조수 0일 때)</text><text x="633" y="242" font-size="17" fill="#17324d" font-weight="400">TAB06: 대체공정·ANN Cycle을 지우면 통과공정 확인</text><text x="633" y="270" font-size="17" fill="#17324d" font-weight="400">확인창 → 원자재 → PLTCM/제조사양 → 메세지 순서</text>
<path d="M840 325V365" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="375" width="330" height="190" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="53" y="409" font-size="23" fill="#17324d" font-weight="700">④ 이력기록 Activity</text><text x="53" y="441" font-size="17" fill="#17324d" font-weight="400">C104000020ChgHstActivity</text><text x="53" y="469" font-size="17" fill="#17324d" font-weight="400">변경 전후 값 비교 → CHG_HST 텍스트</text><text x="53" y="497" font-size="17" fill="#17324d" font-weight="400">실패하면 저장 자체를 하지 않음</text>
<rect x="385" y="375" width="330" height="190" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="403" y="409" font-size="23" fill="#17324d" font-weight="700">⑤ UPDATE</text><text x="403" y="441" font-size="17" fill="#17324d" font-weight="400">TAB05: MNF_CGLupdate 업무 43개</text><text x="403" y="469" font-size="17" fill="#17324d" font-weight="400">TAB06: EGL_MNFupdate 업무 39개</text><text x="403" y="497" font-size="17" fill="#17324d" font-weight="400">원자재: RMTupdate · 메세지: MSGupdate</text><text x="403" y="525" font-size="17" fill="#17324d" font-weight="400">키: 주문번호·주문행·제조구분</text>
<rect x="735" y="375" width="330" height="190" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="753" y="409" font-size="23" fill="#17324d" font-weight="700">⑥ 수정로그 · 재조회</text><text x="753" y="441" font-size="17" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_MNF_MDF_LOG</text><text x="753" y="469" font-size="17" fill="#17324d" font-weight="400">원자재·PLTCM 7개와 그 _BF 7개만 INSERT</text><text x="753" y="497" font-size="17" fill="#17324d" font-weight="400">TAB05 는 메세지 저장 뒤 이 단계가 없습니다</text>
<path d="M370 470H380" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M720 470H730" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="35" y="610" font-size="20" fill="#17324d" font-weight="700">시스템 설계값으로 되돌리려면 ‘재설계’(C104000040)를 써야 합니다. 재설계는 제조표준 행을 지우고 6단계를 다시 실행합니다.</text></g></svg>
