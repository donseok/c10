<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="755" viewBox="0 0 1100 755" role="img" aria-labelledby="title desc"><title id="title">Slit 표시 규칙</title><desc id="desc">S/T 유무가 Y가 아니면 조수와 조합폭1을 빈칸으로 표시하고, 조합폭1이 0이면 정전폭목표값으로 대체한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="755" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="29" fill="#17324d" font-weight="700">조수와 조합폭1은 “S/T 유무”에 따라 보였다 숨었다 합니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">조회 SQL이 값을 그대로 내려주지 않고 S/T 유무를 먼저 봅니다. 조합폭 2~10은 이 규칙 밖입니다.</text>
<rect x="400" y="118" width="300" height="44" rx="22" fill="#007f86"/><text x="550" y="146" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">조회 SQL 시작</text>
<path d="M550 165V200" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="550,203 730,242 550,281 370,242" fill="#e2f1f0" stroke="#b7c8d5"/><text x="550" y="237" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">S/T 유무(COR_EDG_ASG_TP)가</text><text x="550" y="259" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">Y 인가?</text>
<path d="M370 242H240" fill="none" stroke="#b3261e" stroke-width="3" marker-end="url(#arrow)"/>
<text x="250" y="234" font-size="17" fill="#b3261e" font-weight="700">아니오 / 값 없음</text>
<rect x="35" y="208" width="205" height="68" rx="12" fill="#fdecea" stroke="#e5b4b0"/>
<text x="137" y="238" font-size="18" fill="#b3261e" font-weight="700" text-anchor="middle">조수 = 빈칸</text>
<text x="137" y="264" font-size="18" fill="#b3261e" font-weight="700" text-anchor="middle">조합폭1 = 빈칸</text>
<path d="M550 282V320" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="566" y="308" font-size="18" fill="#007f86" font-weight="700">예</text>
<polygon points="550,328 730,368 550,408 370,368" fill="#e2f1f0" stroke="#b7c8d5"/><text x="550" y="363" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">조합폭1(MIX_WTH1) 이</text><text x="550" y="385" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">0 이거나 비어 있는가?</text>
<path d="M730 368H830" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="742" y="358" font-size="18" fill="#007f86" font-weight="700">예</text>
<rect x="835" y="330" width="230" height="80" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="851" y="362" font-size="20" fill="#17324d" font-weight="700">조합폭1 자리에</text><text x="851" y="392" font-size="17" fill="#17324d" font-weight="400">정전폭목표값</text><text x="851" y="418" font-size="17" fill="#17324d" font-weight="400">(COR_WTH_TRV) 표시</text>
<path d="M550 410V450" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="566" y="438" font-size="18" fill="#516579" font-weight="700">아니오</text>
<rect x="370" y="450" width="360" height="80" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="386" y="482" font-size="20" fill="#17324d" font-weight="700">조합폭1 그대로 표시</text><text x="386" y="512" font-size="17" fill="#17324d" font-weight="400">조수도 저장값 그대로</text>
<rect x="35" y="560" width="1030" height="120" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="55" y="596" font-size="22" fill="#17324d" font-weight="700">조합폭 2~10 은 이 판단을 거치지 않습니다</text>
<text x="55" y="630" font-size="19" fill="#17324d" font-weight="400">각각 0 이거나 비어 있으면 빈칸으로, 값이 있으면 그대로 보여줍니다. S/T 유무와 무관합니다.</text>
<text x="55" y="660" font-size="19" fill="#8a6100" font-weight="700">그래서 S/T 가 N 인데 조합폭 2~10 에만 숫자가 남아 보이는 화면이 나올 수 있습니다.</text>
<text x="35" y="720" font-size="20" fill="#17324d" font-weight="700">화면에서 조수가 비어 보인다고 DB의 조수가 0 이라는 뜻은 아닙니다. 먼저 S/T 유무를 확인합니다.</text></g></svg>
