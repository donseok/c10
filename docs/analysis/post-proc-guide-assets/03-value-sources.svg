<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="725" viewBox="0 0 1100 725" role="img" aria-labelledby="title desc"><title id="title">값의 출처 지도</title><desc id="desc">후공정 화면 항목이 주문 접수, 자동설계, 조회 SQL 계산, 다른 시스템 중 어디서 오는지 정리한 표.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="725" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="30" fill="#17324d" font-weight="700">화면의 값은 네 곳에서 옵니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">후공정 탭이 스스로 계산하는 값은 SKID 치수 두 개뿐입니다. 나머지는 가져오거나 조회한 값입니다.</text>
<rect x="35" y="118" width="245" height="52" rx="12" fill="#e8eef8" stroke="#b7c8d5"/>
<text x="157" y="151" font-size="21" fill="#17324d" font-weight="700" text-anchor="middle">주문 접수</text>
<rect x="293" y="118" width="245" height="52" rx="12" fill="#e6f2ee" stroke="#b7c8d5"/>
<text x="415" y="151" font-size="21" fill="#17324d" font-weight="700" text-anchor="middle">자동설계</text>
<rect x="551" y="118" width="245" height="52" rx="12" fill="#fdf0e0" stroke="#b7c8d5"/>
<text x="673" y="151" font-size="21" fill="#17324d" font-weight="700" text-anchor="middle">조회 SQL 계산</text>
<rect x="809" y="118" width="245" height="52" rx="12" fill="#f3eef7" stroke="#b7c8d5"/>
<text x="931" y="151" font-size="21" fill="#17324d" font-weight="700" text-anchor="middle">다른 시스템</text>
<rect x="35" y="190" width="1030" height="46" fill="#e3eef2"/><text x="45" y="220" font-size="19" fill="#17324d" font-weight="700">화면 항목</text><text x="475" y="220" font-size="19" fill="#17324d" font-weight="700">출처</text><text x="725" y="220" font-size="19" fill="#17324d" font-weight="700">비고</text><rect x="35" y="236" width="1030" height="44" fill="#f6f8fc" stroke="#b7c8d5"/><text x="45" y="265" font-size="19" fill="#17324d" font-weight="400">엠보스무늬 · SHEET적치방법 · 포장방법</text><text x="475" y="265" font-size="19" fill="#17324d" font-weight="400">주문 접수</text><text x="725" y="265" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_CMN</text><rect x="35" y="280" width="1030" height="44" fill="#f6f8fc" stroke="#b7c8d5"/><text x="45" y="309" font-size="19" fill="#17324d" font-weight="400">보호필름 상세코드 · 폭 · 부착위치</text><text x="475" y="309" font-size="19" fill="#17324d" font-weight="400">주문 접수</text><text x="725" y="309" font-size="19" fill="#17324d" font-weight="400">CMN · 상세코드는 자리별로 쪼개 표시</text><rect x="35" y="324" width="1030" height="44" fill="#f6f8fc" stroke="#b7c8d5"/><text x="45" y="353" font-size="19" fill="#17324d" font-weight="400">SHL 작업 SIZE(조분할 두께·폭·길이)</text><text x="475" y="353" font-size="19" fill="#17324d" font-weight="400">주문 접수</text><text x="725" y="353" font-size="19" fill="#17324d" font-weight="400">CMN · 조분할여부가 Y일 때만 의미</text><rect x="35" y="368" width="1030" height="44" fill="#f6f8fc" stroke="#b7c8d5"/><text x="45" y="397" font-size="19" fill="#17324d" font-weight="400">1T2C 유무 · 포장메세지코드</text><text x="475" y="397" font-size="19" fill="#17324d" font-weight="400">주문 접수</text><text x="725" y="397" font-size="19" fill="#17324d" font-weight="400">CMN · 이 화면에서 수정 가능</text><rect x="35" y="412" width="1030" height="44" fill="#f8f5fb" stroke="#b7c8d5"/><text x="45" y="441" font-size="19" fill="#17324d" font-weight="400">Slit 조수 · 조합폭 1~10 · 제품폭범위</text><text x="475" y="441" font-size="19" fill="#17324d" font-weight="400">자동설계 폭 단계</text><text x="725" y="441" font-size="19" fill="#17324d" font-weight="400">C103100080 결과를 MNF에 저장</text><rect x="35" y="456" width="1030" height="44" fill="#f8f5fb" stroke="#b7c8d5"/><text x="45" y="485" font-size="19" fill="#17324d" font-weight="400">S/T 유무(정전 Edge)</text><text x="475" y="485" font-size="19" fill="#17324d" font-weight="400">자동설계 공정 Size</text><text x="725" y="485" font-size="19" fill="#17324d" font-weight="400">주문 Edge가 S 또는 C이면 Y</text><rect x="35" y="500" width="1030" height="44" fill="#f8f5fb" stroke="#b7c8d5"/><text x="45" y="529" font-size="19" fill="#17324d" font-weight="400">방청유(도유코드)</text><text x="475" y="529" font-size="19" fill="#17324d" font-weight="400">자동설계 제조사양</text><text x="725" y="529" font-size="19" fill="#17324d" font-weight="400">C10B2170 · 품명 C·1만</text><rect x="35" y="544" width="1030" height="44" fill="#f8f5fb" stroke="#b7c8d5"/><text x="45" y="573" font-size="19" fill="#17324d" font-weight="400">정전 품질메세지</text><text x="475" y="573" font-size="19" fill="#17324d" font-weight="400">자동설계 설계Key</text><text x="725" y="573" font-size="19" fill="#17324d" font-weight="400">C10B1040 의 정전메세지 열</text><rect x="35" y="588" width="1030" height="44" fill="#fdf7ef" stroke="#b7c8d5"/><text x="45" y="617" font-size="19" fill="#17324d" font-weight="400">SKID 폭 · 길이</text><text x="475" y="617" font-size="19" fill="#17324d" font-weight="400">조회 SQL 계산</text><text x="725" y="617" font-size="19" fill="#17324d" font-weight="400">조분할·제품형태로 그때 계산</text><rect x="35" y="632" width="1030" height="44" fill="#f8f5fb" stroke="#b7c8d5"/><text x="45" y="661" font-size="19" fill="#17324d" font-weight="400">보호필름 관리점착력</text><text x="475" y="661" font-size="19" fill="#17324d" font-weight="400">다른 시스템 우선</text><text x="725" y="661" font-size="19" fill="#17324d" font-weight="400">칼라 BOM 값이 있으면 그 값</text>
<text x="35" y="690" font-size="20" fill="#17324d" font-weight="700">“설계가 안 됐다”와 “주문에 안 적혔다”는 다른 문제입니다. 값이 비면 먼저 이 표에서 출처를 확인합니다.</text></g></svg>
