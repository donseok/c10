<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="665" viewBox="0 0 1100 665" role="img" aria-labelledby="title desc"><title id="title">확정주문 검사 비활성</title><desc id="desc">후공정 탭은 확정주문 검사를 하지 않아 확정된 주문도 수정되며 관련 코드는 주석 처리되어 있다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="665" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="30" fill="#17324d" font-weight="700">확정된 주문도 후공정 탭에서는 수정됩니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">확정주문을 막는 코드가 있지만 2014-06-11 요청으로 주석 처리되어 실행되지 않습니다</text>
<rect x="35" y="120" width="1030" height="46" fill="#e3eef2"/><text x="45" y="150" font-size="19" fill="#17324d" font-weight="700">탭</text><text x="325" y="150" font-size="19" fill="#17324d" font-weight="700">확정주문일 때</text><text x="725" y="150" font-size="19" fill="#17324d" font-weight="700">근거</text><rect x="35" y="166" width="1030" height="52" fill="#fff" stroke="#b7c8d5"/><text x="45" y="199" font-size="19" fill="#17324d" font-weight="700">용융도금 TAB05</text><text x="325" y="199" font-size="19" fill="#8a6100" font-weight="700">경고만 하고 저장 진행</text><text x="725" y="199" font-size="19" fill="#516579" font-weight="400">return 이 주석 처리</text><rect x="35" y="218" width="1030" height="52" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="251" font-size="19" fill="#17324d" font-weight="700">전기도금 TAB06</text><text x="325" y="251" font-size="19" fill="#007f86" font-weight="700">알림 후 저장 중단</text><text x="725" y="251" font-size="19" fill="#516579" font-weight="400">정상 동작</text><rect x="35" y="270" width="1030" height="52" fill="#fdecea" stroke="#b7c8d5"/><text x="45" y="303" font-size="19" fill="#17324d" font-weight="700">후공정 TAB09</text><text x="325" y="303" font-size="19" fill="#b3261e" font-weight="700">검사 자체를 하지 않음</text><text x="725" y="303" font-size="19" fill="#516579" font-weight="400">검사 블록 전체가 주석</text>
<rect x="35" y="320" width="1030" height="140" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="51" y="352" font-size="22" fill="#17324d" font-weight="700">남아 있는 주석</text><text x="51" y="382" font-size="19" fill="#17324d" font-weight="400">“확정된 주문이라도 수정할수 있도록 수정 : 박성용요청 20140611”</text><text x="51" y="408" font-size="19" fill="#17324d" font-weight="400">주석 안에는 확정주문 조회와 “확정된 주문입니다!” 알림, 그리고 저장 중단 코드가 그대로 들어 있습니다.</text><text x="51" y="434" font-size="19" fill="#17324d" font-weight="400">조회용 SQL(STSselect)과 서비스의 확정주문 액티비티도 남아 있지만 이 화면에서 호출하지 않습니다.</text>
<rect x="35" y="480" width="1030" height="150" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="51" y="512" font-size="22" fill="#17324d" font-weight="700">조사할 때 유의할 점</text><text x="51" y="542" font-size="19" fill="#17324d" font-weight="400">확정 이후에 후공정 값이 바뀐 흔적이 있어도 그것만으로 비정상 조작이라고 볼 수 없습니다.</text><text x="51" y="568" font-size="19" fill="#17324d" font-weight="400">변경 이력 표(TB_C10_QLT_DSN_CHG_HST)에 이 화면 이름이 남으므로 언제 누가 고쳤는지는 추적할 수 있습니다.</text><text x="51" y="594" font-size="19" fill="#17324d" font-weight="400">다만 이 화면의 이력에는 어떤 값이 어떻게 바뀌었는지가 아니라 화면 이름만 남습니다.</text></g></svg>
