<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="910" viewBox="0 0 1100 910" role="img" aria-labelledby="title desc"><title id="title">SKID 치수 계산</title><desc id="desc">제품형태가 Sheet이고 조분할이 Y이면 조분할 값을, 아니면 주문 치수를 쓰고 코일은 빈칸이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="910" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="29" fill="#17324d" font-weight="700">SKID 폭·길이는 저장된 값이 아니라 조회할 때 계산합니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">제품형태와 조분할 여부를 보고 세 갈래로 갈립니다. DB 에 SKID 컬럼은 없습니다.</text>
<rect x="410" y="116" width="280" height="44" rx="22" fill="#007f86"/><text x="550" y="144" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">SKID 칸 계산 시작</text>
<path d="M550 163V198" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="550,202 720,240 550,278 380,240" fill="#e2f1f0" stroke="#b7c8d5"/><text x="550" y="235" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">제품형태가</text><text x="550" y="257" font-size="19" fill="#17324d" font-weight="700" text-anchor="middle">Sheet(S) 인가?</text>
<path d="M380 240H250" fill="none" stroke="#b3261e" stroke-width="3" marker-end="url(#arrow)"/>
<text x="258" y="232" font-size="17" fill="#b3261e" font-weight="700">아니오 (코일 등)</text>
<rect x="35" y="212" width="215" height="56" rx="12" fill="#fdecea" stroke="#e5b4b0"/>
<text x="142" y="247" font-size="19" fill="#b3261e" font-weight="700" text-anchor="middle">빈칸으로 표시</text>
<path d="M550 278V316" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="566" y="304" font-size="18" fill="#007f86" font-weight="700">예</text>
<polygon points="550,323 760,368 550,413 340,368" fill="#e2f1f0" stroke="#b7c8d5"/><text x="550" y="363" font-size="18" fill="#17324d" font-weight="700" text-anchor="middle">조분할여부 Y 이고</text><text x="550" y="385" font-size="18" fill="#17324d" font-weight="700" text-anchor="middle">조분할 폭·길이가 모두 0 보다 큰가?</text>
<path d="M760 368H845" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="772" y="358" font-size="18" fill="#007f86" font-weight="700">예</text>
<rect x="850" y="320" width="215" height="96" rx="12" fill="#e4f4ef" stroke="#b7c8d5"/><text x="866" y="352" font-size="20" fill="#17324d" font-weight="700">조분할 값 사용</text><text x="866" y="382" font-size="17" fill="#17324d" font-weight="400">폭 = 둘 중 작은 값</text><text x="866" y="408" font-size="17" fill="#17324d" font-weight="400">길이 = 둘 중 큰 값</text>
<path d="M550 413V455" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="566" y="442" font-size="18" fill="#516579" font-weight="700">아니오</text>
<rect x="335" y="455" width="430" height="96" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="351" y="487" font-size="20" fill="#17324d" font-weight="700">주문 치수 사용</text><text x="351" y="517" font-size="17" fill="#17324d" font-weight="400">폭 = 주문폭·주문길이 중 작은 값</text><text x="351" y="543" font-size="17" fill="#17324d" font-weight="400">길이 = 주문폭·주문길이 중 큰 값</text>
<rect x="35" y="585" width="1030" height="252" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="55" y="622" font-size="23" fill="#17324d" font-weight="700">설명용 예제</text>
<rect x="55" y="636" width="990" height="38" fill="#e3eef2"/><text x="65" y="666" font-size="18" fill="#17324d" font-weight="700">상황</text><text x="405" y="666" font-size="18" fill="#17324d" font-weight="700">입력</text><text x="745" y="666" font-size="18" fill="#17324d" font-weight="700">SKID 폭 / 길이</text><rect x="55" y="674" width="990" height="38" fill="#fff" stroke="#b7c8d5"/><text x="65" y="700" font-size="18" fill="#17324d" font-weight="400">Sheet · 조분할 N</text><text x="405" y="700" font-size="18" fill="#17324d" font-weight="400">주문폭 1,000 · 주문길이 2,000</text><text x="745" y="700" font-size="18" fill="#17324d" font-weight="400">1,000 / 2,000</text><rect x="55" y="712" width="990" height="38" fill="#fafcfd" stroke="#b7c8d5"/><text x="65" y="738" font-size="18" fill="#17324d" font-weight="400">Sheet · 조분할 N (길이가 더 짧음)</text><text x="405" y="738" font-size="18" fill="#17324d" font-weight="400">주문폭 1,200 · 주문길이 900</text><text x="745" y="738" font-size="18" fill="#17324d" font-weight="400">900 / 1,200</text><rect x="55" y="750" width="990" height="38" fill="#fff" stroke="#b7c8d5"/><text x="65" y="776" font-size="18" fill="#17324d" font-weight="400">Sheet · 조분할 Y</text><text x="405" y="776" font-size="18" fill="#17324d" font-weight="400">조분할폭 500 · 조분할길이 1,800</text><text x="745" y="776" font-size="18" fill="#17324d" font-weight="400">500 / 1,800</text><rect x="55" y="788" width="990" height="38" fill="#fafcfd" stroke="#b7c8d5"/><text x="65" y="814" font-size="18" fill="#b3261e" font-weight="400">코일</text><text x="405" y="814" font-size="18" fill="#b3261e" font-weight="400">제품형태 C</text><text x="745" y="814" font-size="18" fill="#b3261e" font-weight="400">빈칸 / 빈칸</text>
<text x="35" y="876" font-size="20" fill="#17324d" font-weight="700">항상 작은 값이 폭, 큰 값이 길이입니다. 주문에 적힌 폭·길이 이름과 뒤바뀔 수 있습니다.</text></g></svg>
