<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">저장 경로별 대상표</title><desc id="desc">세 저장 경로가 제조표준, 설계공통, 정전 메세지 표를 각각 바꾸고 이력기록이 컬럼별 전후 값을 남긴다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="700" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="30" fill="#17324d" font-weight="700">세 저장 경로가 서로 다른 표를 건드립니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">각 경로 앞에 이력기록이 붙어 컬럼마다 전·후 값을 남깁니다. 이력기록이 실패하면 저장은 실행되지 않습니다</text>
<rect x="35" y="118" width="1030" height="46" fill="#e3eef2"/><text x="45" y="148" font-size="19" fill="#17324d" font-weight="700">경로</text><text x="245" y="148" font-size="19" fill="#17324d" font-weight="700">바꾸는 표</text><text x="545" y="148" font-size="19" fill="#17324d" font-weight="700">바꾸는 값</text><text x="885" y="148" font-size="19" fill="#17324d" font-weight="700">키</text><rect x="35" y="164" width="1030" height="46" fill="#eef7f8" stroke="#b7c8d5"/><text x="45" y="194" font-size="19" fill="#17324d" font-weight="400">COR_save</text><text x="245" y="194" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_MNF</text><text x="545" y="194" font-size="19" fill="#17324d" font-weight="400">조수·조합폭 1~10·S/T·제품폭범위</text><text x="885" y="194" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행</text><rect x="35" y="210" width="1030" height="46" fill="#eef7f8" stroke="#b7c8d5"/><text x="45" y="240" font-size="19" fill="#17324d" font-weight="400">(같은 경로 2단계)</text><text x="245" y="240" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_CMN</text><text x="545" y="240" font-size="19" fill="#17324d" font-weight="400">1T2C 유무</text><text x="885" y="240" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행</text><rect x="35" y="256" width="1030" height="46" fill="#fff" stroke="#b7c8d5"/><text x="45" y="286" font-size="19" fill="#17324d" font-weight="400">MSG_save</text><text x="245" y="286" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_MSG1</text><text x="545" y="286" font-size="19" fill="#17324d" font-weight="400">정전 품질메세지 문구</text><text x="885" y="286" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행</text><rect x="35" y="302" width="1030" height="46" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="332" font-size="19" fill="#17324d" font-weight="400">PKG_save</text><text x="245" y="332" font-size="19" fill="#17324d" font-weight="400">TB_C10_QLT_DSN_CMN</text><text x="545" y="332" font-size="19" fill="#17324d" font-weight="400">포장메세지코드</text><text x="885" y="332" font-size="19" fill="#17324d" font-weight="400">주문 + 주문행</text>
<text x="35" y="378" font-size="21" fill="#17324d" font-weight="700">COR_save 는 두 표를 잇달아 바꿉니다</text>
<rect x="35" y="400" width="240" height="86" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="51" y="433" font-size="19" fill="#17324d" font-weight="700">이력기록(후공정)</text>
<text x="51" y="463" font-size="17" fill="#516579" font-weight="400">MNF 컬럼별 전·후 기록</text>
<path d="M279 443H293" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="297" y="400" width="240" height="86" rx="12" fill="#fff4e7" stroke="#b7c8d5"/>
<text x="313" y="433" font-size="19" fill="#17324d" font-weight="700">후공정 save</text>
<text x="313" y="463" font-size="17" fill="#516579" font-weight="400">MNF UPDATE</text>
<path d="M541 443H555" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="559" y="400" width="240" height="86" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="575" y="433" font-size="19" fill="#17324d" font-weight="700">이력기록(1T2C)</text>
<text x="575" y="463" font-size="17" fill="#516579" font-weight="400">CMN 컬럼별 전·후 기록</text>
<path d="M803 443H817" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="821" y="400" width="240" height="86" rx="12" fill="#fff4e7" stroke="#b7c8d5"/>
<text x="837" y="433" font-size="19" fill="#17324d" font-weight="700">1T2C save</text>
<text x="837" y="463" font-size="17" fill="#516579" font-weight="400">CMN UPDATE</text>
<rect x="35" y="515" width="1030" height="150" rx="12" fill="#fdecea" stroke="#b7c8d5"/><text x="51" y="547" font-size="22" fill="#17324d" font-weight="700">네 단계 중 하나라도 실패하면</text><text x="51" y="577" font-size="19" fill="#17324d" font-weight="400">그 자리에서 멈추고 뒤 단계는 실행되지 않습니다. 앞 단계까지의 변경은 트랜잭션 설정에 따라 처리됩니다.</text><text x="51" y="603" font-size="19" fill="#17324d" font-weight="400">따라서 정전 값만 바뀌고 1T2C 는 그대로인 상태가 남을 수 있습니다. 두 값을 함께 확인하세요.</text><text x="51" y="629" font-size="19" fill="#17324d" font-weight="400">이력은 TB_C10_QLT_DSN_CHG_HST 에 컬럼마다 한 행씩, OLD_VAL·NEW_VAL 과 함께 남습니다.</text></g></svg>
