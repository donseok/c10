<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="title desc"><title id="title">저장 시 보호 규칙</title><desc id="desc">S/T 유무가 Y가 아니면 조수와 조합폭1은 기존 값을 유지하지만 조합폭 2~10은 화면 값으로 덮어쓴다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516579"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker></defs><rect width="1100" height="730" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="46" font-size="29" fill="#17324d" font-weight="700">저장할 때도 S/T 유무가 조수·조합폭1을 지켜 줍니다</text>
<text x="35" y="84" font-size="21" fill="#516579" font-weight="400">UPDATE 문의 DECODE 가 S/T 가 Y 일 때만 새 값을 씁니다. 조합폭 2~10 에는 이 보호가 없습니다.</text>
<rect x="35" y="120" width="1065" height="46" fill="#e3eef2"/><text x="45" y="150" font-size="19" fill="#17324d" font-weight="700">저장 컬럼</text><text x="345" y="150" font-size="19" fill="#17324d" font-weight="700">S/T 유무 = Y</text><text x="675" y="150" font-size="19" fill="#17324d" font-weight="700">S/T 유무 ≠ Y</text><rect x="35" y="166" width="1065" height="48" fill="#fff" stroke="#b7c8d5"/><text x="45" y="197" font-size="19" fill="#17324d" font-weight="700">Slit 조수</text><text x="345" y="197" font-size="19" fill="#007f86" font-weight="700">화면 값으로 갱신</text><text x="675" y="197" font-size="19" fill="#8a6100" font-weight="700">기존 DB 값 유지</text><rect x="35" y="214" width="1065" height="48" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="245" font-size="19" fill="#17324d" font-weight="700">조합폭1</text><text x="345" y="245" font-size="19" fill="#007f86" font-weight="700">화면 값으로 갱신</text><text x="675" y="245" font-size="19" fill="#8a6100" font-weight="700">기존 DB 값 유지</text><rect x="35" y="262" width="1065" height="48" fill="#fff" stroke="#b7c8d5"/><text x="45" y="293" font-size="19" fill="#17324d" font-weight="700">조합폭 2~10</text><text x="345" y="293" font-size="19" fill="#007f86" font-weight="700">화면 값으로 갱신</text><text x="675" y="293" font-size="19" fill="#b3261e" font-weight="700">화면 값으로 갱신 (보호 없음)</text><rect x="35" y="310" width="1065" height="48" fill="#fafcfd" stroke="#b7c8d5"/><text x="45" y="341" font-size="19" fill="#17324d" font-weight="400">S/T 유무</text><text x="345" y="341" font-size="19" fill="#17324d" font-weight="400">화면 값으로 갱신</text><text x="675" y="341" font-size="19" fill="#17324d" font-weight="400">화면 값으로 갱신</text><rect x="35" y="358" width="1065" height="48" fill="#fff" stroke="#b7c8d5"/><text x="45" y="389" font-size="19" fill="#17324d" font-weight="400">제품폭범위 하한·상한</text><text x="345" y="389" font-size="19" fill="#17324d" font-weight="400">화면 값으로 갱신</text><text x="675" y="389" font-size="19" fill="#17324d" font-weight="400">화면 값으로 갱신</text>
<rect x="35" y="410" width="1030" height="150" rx="12" fill="#fdecea" stroke="#e5b4b0"/>
<text x="55" y="448" font-size="23" fill="#b3261e" font-weight="700">여기서 생기는 어긋남</text>
<text x="55" y="484" font-size="19" fill="#17324d" font-weight="400">S/T 가 N 이면 화면의 조수·조합폭1 칸은 빈칸입니다. 그 상태로 저장해도 DB 값은 그대로 남습니다.</text>
<text x="55" y="514" font-size="19" fill="#17324d" font-weight="400">반면 조합폭 2~10 은 화면에 보이는 값이 그대로 덮어써집니다. 빈칸이면 빈 값이 들어갑니다.</text>
<text x="55" y="544" font-size="19" fill="#b3261e" font-weight="700">즉 S/T 를 N 으로 바꾸고 저장하면 조합폭 1 만 남고 2~10 이 지워질 수 있습니다.</text>
<rect x="35" y="585" width="1030" height="110" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="51" y="617" font-size="22" fill="#17324d" font-weight="700">확인 순서</text><text x="51" y="647" font-size="19" fill="#17324d" font-weight="400">① 저장 전 S/T 유무 값 · ② 화면에 보이는 조수·조합폭 1~10 · ③ 저장 후 DB 의 같은 열</text><text x="51" y="673" font-size="19" fill="#17324d" font-weight="400">세 가지를 나란히 적어 두면 어느 칸이 보호되고 어느 칸이 덮어써졌는지 바로 보입니다.</text></g></svg>
