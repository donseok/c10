<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="957" viewBox="0 0 1100 957" role="img" aria-labelledby="title desc"><title id="title">제품폭 대비 추가14mm의 구성</title><desc id="desc">제품목표1002에 정전수축1 정전마진3 도금수축2 압연수축3 원자재마진5를 더해1016. 추가량은6mm수축과8mm마진.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="957" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="48" font-size="31" fill="#17324d" font-weight="700">제품폭 1,002에 추가로 필요한 14mm를 펼쳐 보면</text>
<text x="35" y="88" font-size="22" fill="#516579" font-weight="400">설명용 GI · Edge S · 정전 통과 · 대체공정 없음 · 중간재 미적용</text>
<rect x="35" y="117" width="1030" height="91" rx="12" fill="#eef7f8" stroke="#b7c8d5"/>
<text x="57" y="153" font-size="24" fill="#17324d" font-weight="400">출발점은 이미 폭여유가 포함된 제품목표폭</text>
<text x="810" y="174" font-size="39" fill="#007f86" font-weight="700">1,002</text>
<text x="35" y="250" font-size="23" fill="#17324d" font-weight="700">추가 폭의 구성  ─  청록: 수축 보완 / 황토: 기준 마진</text>
<rect x="60" y="287" width="68" height="67" fill="#16828b"/>
<text x="78" y="331" font-size="25" fill="#fff" font-weight="700">+1</text>
<rect x="128" y="287" width="204" height="67" fill="#bd741d"/>
<text x="214" y="331" font-size="25" fill="#fff" font-weight="700">+3</text>
<rect x="332" y="287" width="136" height="67" fill="#16828b"/>
<text x="384" y="331" font-size="25" fill="#fff" font-weight="700">+2</text>
<rect x="468" y="287" width="204" height="67" fill="#16828b"/>
<text x="554" y="331" font-size="25" fill="#fff" font-weight="700">+3</text>
<rect x="672" y="287" width="340" height="67" fill="#bd741d"/>
<text x="826" y="331" font-size="25" fill="#fff" font-weight="700">+5</text>
<text x="60" y="388" font-size="19" fill="#516579" font-weight="400">0</text>
<text x="980" y="388" font-size="19" fill="#516579" font-weight="400">14mm</text>
<rect x="35" y="425" width="1030" height="79" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="57" y="473" font-size="24" fill="#17324d" font-weight="700">도금 목표폭</text>
<text x="400" y="473" font-size="25" fill="#17324d" font-weight="400">1,002 + 1 + 3</text>
<text x="880" y="474" font-size="31" fill="#007f86" font-weight="700">1,006</text>
<rect x="35" y="523" width="1030" height="79" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/>
<text x="57" y="571" font-size="24" fill="#17324d" font-weight="700">압연 목표폭</text>
<text x="400" y="571" font-size="25" fill="#17324d" font-weight="400">1,006 + 2</text>
<text x="880" y="572" font-size="31" fill="#007f86" font-weight="700">1,008</text>
<rect x="35" y="621" width="1030" height="79" rx="12" fill="#eef7f8" stroke="#b7c8d5"/>
<text x="57" y="669" font-size="24" fill="#17324d" font-weight="700">원자재 목표폭</text>
<text x="400" y="669" font-size="25" fill="#17324d" font-weight="400">1,008 + 3 + 5</text>
<text x="880" y="670" font-size="31" fill="#007f86" font-weight="700">1,016</text>
<text x="35" y="770" font-size="24" fill="#17324d" font-weight="700">수축 보완 1+2+3 = 6mm  /  마진 3+5 = 8mm  /  합계 +14mm</text>
<text x="35" y="812" font-size="21" fill="#516579" font-weight="400">색 막대는 “추가 14mm”만 실제 비율로 표시했습니다. 제품폭 1,002는 생략했습니다.</text>
<text x="35" y="850" font-size="21" fill="#516579" font-weight="400">각 수치는 업무기준 조회 결과라는 가정입니다. 폭 양쪽에 각각 더하는 값이 아닙니다.</text>
<rect x="40" y="912" width="14" height="14" fill="#16828b"/>
<text x="61" y="925" font-size="20" fill="#17324d" font-weight="400">정전 수축 +1</text>
<rect x="250" y="912" width="14" height="14" fill="#bd741d"/>
<text x="271" y="925" font-size="20" fill="#17324d" font-weight="400">정전 마진 +3</text>
<rect x="460" y="912" width="14" height="14" fill="#16828b"/>
<text x="481" y="925" font-size="20" fill="#17324d" font-weight="400">도금 수축 +2</text>
<rect x="670" y="912" width="14" height="14" fill="#16828b"/>
<text x="691" y="925" font-size="20" fill="#17324d" font-weight="400">압연 수축 +3</text>
<rect x="880" y="912" width="14" height="14" fill="#bd741d"/>
<text x="901" y="925" font-size="20" fill="#17324d" font-weight="400">원자재 마진 +5</text></g></svg>
