<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="728" viewBox="0 0 1100 728" role="img" aria-labelledby="title desc"><title id="title">조합폭과 재단선 2조 특례</title><desc id="desc">일반 Slit은 600과 400에 조당 여유2를 더해1004. 재단선Y 2조 특례는602를 구한 뒤 수축1을 더하고 두배하여1206.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="728" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="48" font-size="31" fill="#17324d" font-weight="700">Slit 조수가 있으면 조합폭을 먼저 확인합니다</text>
<text x="35" y="88" font-size="22" fill="#516579" font-weight="400">설명용 폭여유 2mm / 나머지 조합폭은 0 / 재단선 2조 특례는 아래 별도</text>
<rect x="35" y="125" width="618" height="115" rx="12" fill="#eef7f8" stroke="#b7c8d5"/>
<rect x="653" y="125" width="412" height="115" rx="12" fill="#fff4e7" stroke="#b7c8d5"/>
<text x="235" y="195" font-size="30" fill="#17324d" font-weight="700">조합폭 1 = 600</text>
<text x="715" y="195" font-size="30" fill="#17324d" font-weight="700">조합폭 2 = 400</text>
<path d="M550 245V280" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="294" width="1030" height="124" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="55" y="331" font-size="26" fill="#17324d" font-weight="700">일반 Slit 2조 → 제품목표폭 1,004</text><text x="55" y="369" font-size="22" fill="#17324d" font-weight="400">600 + 400 + (2 × 2) = 1,004</text><text x="55" y="400" font-size="22" fill="#17324d" font-weight="400">주문폭에 조수를 곱하는 과거 주석보다, 현재 조합폭 합산 코드를 우선합니다.</text>
<rect x="35" y="453" width="1030" height="184" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="55" y="490" font-size="26" fill="#17324d" font-weight="700">재단선 Y · 2조 · 주문폭 1,200 · 조합폭 1 = 600</text><text x="55" y="528" font-size="22" fill="#17324d" font-weight="400">제품목표폭 = 600 + 2 = 602</text><text x="55" y="559" font-size="22" fill="#17324d" font-weight="400">CCL수축 1 가정 → 중간정전 목표폭 = (602 + 1) × 2 = 1,206</text><text x="55" y="590" font-size="22" fill="#17324d" font-weight="400">이 특례는 조합폭 1을 사용합니다. 조합폭 1+2로 바꾸어 계산하지 않습니다.</text>
<text x="35" y="689" font-size="22" fill="#17324d" font-weight="400">제품폭 보증범위는 원래 주문폭 + 인수도공차입니다. 이 목표폭 합산과 별도입니다.</text></g></svg>
