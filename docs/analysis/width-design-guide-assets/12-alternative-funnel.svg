<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="842" viewBox="0 0 1100 842" role="img" aria-labelledby="title desc"><title id="title">대체공정 최대폭 선택</title><desc id="desc">도금목표1006에서 주1008 대체1012 1010 계산. 최대1012로 수축4 마진5 재조회하여1021.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="842" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="48" font-size="29" fill="#17324d" font-weight="700">대체공정이 있으면, 원자재 한 폭으로 어느 경로를 준비할까?</text>
<text x="35" y="88" font-size="22" fill="#516579" font-weight="400">한 제조구분 안에서 비교합니다. 제품목표 1,002 / CGL 목표 1,006 고정 가정.</text>
<rect x="35" y="130" width="330" height="196" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="55" y="167" font-size="26" fill="#17324d" font-weight="700">주공정</text><text x="55" y="205" font-size="22" fill="#17324d" font-weight="400">도금폭 1,006</text><text x="55" y="236" font-size="22" fill="#17324d" font-weight="400">도금수축 +2</text><text x="55" y="267" font-size="22" fill="#17324d" font-weight="400">PLTCM폭 1,008</text>
<rect x="385" y="130" width="330" height="196" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="405" y="167" font-size="26" fill="#17324d" font-weight="700">대체공정 1</text><text x="405" y="205" font-size="22" fill="#17324d" font-weight="400">도금폭 1,006</text><text x="405" y="236" font-size="22" fill="#17324d" font-weight="400">도금수축 +6</text><text x="405" y="267" font-size="22" fill="#17324d" font-weight="400">PLTCM폭 1,012</text>
<rect x="735" y="130" width="330" height="196" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="755" y="167" font-size="26" fill="#17324d" font-weight="700">대체공정 2</text><text x="755" y="205" font-size="22" fill="#17324d" font-weight="400">도금폭 1,006</text><text x="755" y="236" font-size="22" fill="#17324d" font-weight="400">도금수축 +4</text><text x="755" y="267" font-size="22" fill="#17324d" font-weight="400">PLTCM폭 1,010</text>
<path d="M200 330V377H535V412" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M550 330V412" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M900 330V377H565V412" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="432" width="1030" height="112" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="55" y="469" font-size="26" fill="#17324d" font-weight="700">최대 PLTCM폭 = max(1,008, 1,012, 1,010) = 1,012</text><text x="55" y="507" font-size="22" fill="#17324d" font-weight="400">선택하는 것은 저장 PLTCM폭입니다. 적정·차선의 폭을 한데 모으지 않습니다.</text>
<path d="M550 548V589" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="608" width="1030" height="139" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="55" y="645" font-size="26" fill="#17324d" font-weight="700">선택폭 1,012에서 원자재 기준을 다시 조회</text><text x="55" y="683" font-size="22" fill="#17324d" font-weight="400">PLTCM수축 4 + 원자재마진 5 가정</text><text x="55" y="714" font-size="22" fill="#17324d" font-weight="400">원자재폭 = 1,012 + 4 + 5 = 1,021</text>
<text x="35" y="800" font-size="22" fill="#17324d" font-weight="700">1,008 + 1,012 + 1,010으로 합산하지 않습니다. 가장 넓은 PLTCM 목표를 선택합니다.</text></g></svg>
