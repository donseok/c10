<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">PL/ST와 원자재폭의 최대값 연산 비교</title><desc id="desc">PL/ST는 폭수축 합의 최대값을 cap으로 쓴다. 원자재는 PLTCM폭 최대를 먼저 선택하고 수축을 다시 조회한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="660" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="48" font-size="29" fill="#17324d" font-weight="700">원자재폭은 PL/ST 목표폭에 마진을 더한 값과 다를 수 있습니다</text>
<text x="35" y="89" font-size="22" fill="#516579" font-weight="400">설명용: PLTCM 폭 1,008 / 1,012, PLTCM수축 3 / 4, ST보정 +2 / +2</text>
<rect x="35" y="126" width="495" height="144" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="55" y="163" font-size="26" fill="#17324d" font-weight="700">PL/ST 계산의 상한 = 1,016</text><text x="55" y="201" font-size="22" fill="#17324d" font-weight="400">max(1,008+3, 1,012+4)</text><text x="55" y="232" font-size="22" fill="#17324d" font-weight="400">→ 수축을 더한 뒤 최대값을 고름</text>
<rect x="570" y="126" width="495" height="144" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="590" y="163" font-size="26" fill="#17324d" font-weight="700">원자재 계산의 기준폭 = 1,012</text><text x="590" y="201" font-size="22" fill="#17324d" font-weight="400">max(1,008, 1,012)</text><text x="590" y="232" font-size="22" fill="#17324d" font-weight="400">→ PLTCM폭만 먼저 비교함</text>
<path d="M280 273V318" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M815 273V318" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="332" width="495" height="185" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="55" y="369" font-size="26" fill="#17324d" font-weight="700">저장 PL/ST 목표폭</text><text x="55" y="407" font-size="22" fill="#17324d" font-weight="400">주공정: min(1,016, 1,011+2)</text><text x="55" y="438" font-size="22" fill="#17324d" font-weight="400">= 1,013</text><text x="55" y="469" font-size="22" fill="#17324d" font-weight="400">대체 1: min(1,016, 1,016+2)</text><text x="55" y="500" font-size="22" fill="#17324d" font-weight="400">= 1,016</text>
<rect x="570" y="332" width="495" height="185" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="590" y="369" font-size="26" fill="#17324d" font-weight="700">원자재 목표폭</text><text x="590" y="407" font-size="22" fill="#17324d" font-weight="400">선택폭 1,012로 수축기준 재조회</text><text x="590" y="438" font-size="22" fill="#17324d" font-weight="400">수축 4, 마진 5 가정</text><text x="590" y="469" font-size="22" fill="#17324d" font-weight="400">1,012 + 4 + 5 = 1,021</text>
<text x="35" y="579" font-size="25" fill="#17324d" font-weight="700">ST보정은 원자재폭 산식에 직접 들어가지 않습니다.</text>
<text x="35" y="622" font-size="22" fill="#17324d" font-weight="400">원자재폭은 “최대 PL/ST폭 + 마진”으로 계산하지 않습니다. 각 조회 입력을 확인합니다.</text></g></svg>
