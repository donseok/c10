<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="895" viewBox="0 0 1100 895" role="img" aria-labelledby="title desc"><title id="title">적정과 차선의 설계 경로</title><desc id="desc">구매반제품 차선은 제품폭과 공정폭을 복사하되 원자재 Size를 실행한다. 원자재 소재별로 마지막 산식이 다르다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007f86"/></marker></defs><rect width="1100" height="895" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="48" font-size="31" fill="#17324d" font-weight="700">먼저 원자재가 어느 계산 경로를 타는지 확인합니다</text>
<rect x="35" y="95" width="1030" height="105" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="55" y="132" font-size="26" fill="#17324d" font-weight="700">제조구분: 적정(1) · 차선1(2) · 차선2(3)</text><text x="55" y="170" font-size="22" fill="#17324d" font-weight="400">주문번호 + 주문행 + 제조구분으로 한 행을 특정합니다.</text>
<path d="M550 203V242" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="253" width="495" height="180" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="55" y="290" font-size="26" fill="#17324d" font-weight="700">적정 또는 열연 H/M 차선</text><text x="55" y="328" font-size="22" fill="#17324d" font-weight="400">제품폭·공정폭 계산 실행</text><text x="55" y="359" font-size="22" fill="#17324d" font-weight="400">품명 5/7도 별도 예외로 계산</text>
<rect x="570" y="253" width="495" height="180" rx="12" fill="#fff4e7" stroke="#b7c8d5"/><text x="590" y="290" font-size="26" fill="#17324d" font-weight="700">구매반제품 차선</text><text x="590" y="328" font-size="22" fill="#17324d" font-weight="400">제조구분 ≠ 1, 원자재 H/M 아님</text><text x="590" y="359" font-size="22" fill="#17324d" font-weight="400">품명 5/7 제외</text><text x="590" y="390" font-size="22" fill="#17324d" font-weight="400">제품폭·공정폭은 적정에서 복사</text>
<path d="M283 436V487" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M817 436V487" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="500" width="1030" height="106" rx="12" fill="#eef7f8" stroke="#b7c8d5"/><text x="55" y="537" font-size="26" fill="#17324d" font-weight="700">원자재 Size 단계는 각 행에서 실행</text><text x="55" y="575" font-size="22" fill="#17324d" font-weight="400">C10B2230 중간재 적용 여부와 원자재 첫 글자로 마지막 산식을 선택합니다.</text>
<path d="M550 609V648" fill="none" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="660" width="320" height="147" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="55" y="697" font-size="26" fill="#17324d" font-weight="700">열연 일반 경로</text><text x="55" y="735" font-size="22" fill="#17324d" font-weight="400">최대 PLTCM폭</text><text x="55" y="766" font-size="22" fill="#17324d" font-weight="400">+ 수축 + 마진</text><text x="55" y="797" font-size="22" fill="#17324d" font-weight="400">Edge C/N은 별도 산식</text>
<rect x="390" y="660" width="320" height="147" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="410" y="697" font-size="26" fill="#17324d" font-weight="700">구매·중간재 경로</text><text x="410" y="735" font-size="22" fill="#17324d" font-weight="400">D: 최대 PLTCM폭</text><text x="410" y="766" font-size="22" fill="#17324d" font-weight="400">C: TM폭 − 3</text><text x="410" y="797" font-size="22" fill="#17324d" font-weight="400">도금재: CGL/EGL폭 − 1</text>
<rect x="745" y="660" width="320" height="147" rx="12" fill="#f2f5f8" stroke="#b7c8d5"/><text x="765" y="697" font-size="26" fill="#17324d" font-weight="700">품명 5/7</text><text x="765" y="735" font-size="22" fill="#17324d" font-weight="400">제품목표폭 반올림</text><text x="765" y="766" font-size="22" fill="#17324d" font-weight="400">알루미늄칼라</text><text x="765" y="797" font-size="22" fill="#17324d" font-weight="400">스테인레스칼라</text>
<text x="35" y="855" font-size="24" fill="#17324d" font-weight="700">적정 D* F/H는 조건 충족 시 최대 PLTCM폭에서 3mm를 뺍니다.</text></g></svg>
